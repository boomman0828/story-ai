<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이야기 세계</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090e;--s1:#111117;--s2:#17171f;--bd:#222230;--ac:#7c6af7;--tx:#e0e0ea;--dm:#5a5a7a;--red:#e17055;--th:60px;}
.light{--bg:#f5f5fa;--s1:#ffffff;--s2:#f0f0f7;--bd:#d8d8e8;--ac:#7c6af7;--tx:#1a1a2e;--dm:#888899;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;}
.app{display:flex;flex-direction:column;width:100%;height:100%;}
.header{height:52px;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:8px;}
.title{font-family:'Nanum Myeongjo',serif;font-size:21px;font-weight:800;flex:1;}
.theme-btn{background:none;border:none;color:var(--dm);cursor:pointer;font-size:18px;padding:8px;}
.pages{flex:1;overflow:hidden;}
.page{display:none;width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.page.active{display:block;}
.tabbar{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--s1);border-top:1px solid var(--bd);display:flex;z-index:100;}
.tab-btn{flex:1;background:none;border:none;color:var(--dm);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'Noto Sans KR',sans-serif;font-size:12px;}
.tab-btn.active{color:var(--ac);}
.tab-icon{font-size:20px;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:12px 14px;}
.search-box input{flex:1;background:none;border:none;color:var(--tx);font-size:13px;outline:none;}
.search-box input::placeholder{color:var(--dm);}
.filter-scroll{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-chip{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:11px;background:var(--s2);border:1px solid var(--bd);color:var(--dm);cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;}
.filter-chip.active{background:rgba(124,106,247,0.15);border-color:var(--ac);color:var(--ac);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 80px;}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;}
.card-img{width:100%;aspect-ratio:3/4;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:cover;}
.card-genre{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);border-radius:6px;padding:2px 7px;font-size:9px;color:#fff;}
.card-info{padding:10px 11px;}
.card-name{font-family:'Nanum Myeongjo',serif;font-size:15px;font-weight:700;margin-bottom:3px;}
.card-desc{font-size:11px;color:var(--dm);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.empty{text-align:center;padding:60px 20px;color:var(--dm);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.make-header{padding:16px;background:var(--s1);border-bottom:1px solid var(--bd);}
.make-title{font-family:'Nanum Myeongjo',serif;font-size:18px;font-weight:800;}
.make-list{padding:14px 12px 90px;}
.make-card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;display:flex;gap:11px;padding:13px;margin-bottom:8px;align-items:center;}
.make-avatar{width:46px;height:46px;border-radius:11px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.make-avatar img{width:100%;height:100%;object-fit:cover;}
.make-info{flex:1;}
.make-name{font-size:14px;font-weight:500;}
.make-stat{font-size:11px;color:var(--dm);margin-top:2px;}
.make-btns{display:flex;gap:4px;}
.make-btn{background:none;border:none;color:var(--dm);cursor:pointer;font-size:15px;padding:6px;}
.make-btn.del:hover{color:var(--red);}
.fab{position:fixed;bottom:74px;right:16px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--ac),#a29bfe);border:none;color:white;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(124,106,247,0.2);z-index:50;}
.fab:active{transform:scale(0.92);}
.my-content{padding:14px;}
.my-card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;}
.my-title{font-size:10px;color:var(--dm);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;font-weight:600;}
.my-input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;color:var(--tx);font-size:12px;font-family:monospace;outline:none;margin-bottom:8px;}
.my-btn{width:100%;background:var(--ac);color:white;border:none;border-radius:9px;padding:10px;cursor:pointer;font-weight:500;font-family:'Noto Sans KR',sans-serif;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);z-index:200;display:none;}
.overlay.active{display:block;}
.modal{position:fixed;bottom:0;left:0;right:0;width:100%;max-height:95dvh;background:var(--s1);border-radius:22px 22px 0 0;display:none;flex-direction:column;animation:slideUp .27s ease;z-index:201;}
.modal.active{display:flex;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:30px;height:4px;background:var(--bd);border-radius:2px;margin:9px auto 0;}
.modal-header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);}
.modal-title{font-family:'Nanum Myeongjo',serif;font-size:17px;font-weight:700;flex:1;}
.modal-close{background:none;border:none;color:var(--dm);font-size:20px;cursor:pointer;}
.modal-body{flex:1;overflow-y:auto;padding:14px;}
.modal-footer{padding:12px 14px;border-top:1px solid var(--bd);}
.form-group{margin-bottom:14px;}
.form-label{font-size:10px;color:var(--dm);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:block;font-weight:600;}
.form-input,.form-textarea,.form-select{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;color:var(--tx);font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--ac);}
.form-textarea{resize:none;line-height:1.6;}
.form-select option{background:var(--s2);}
.img-upload{border:2px dashed var(--bd);border-radius:11px;padding:18px;text-align:center;cursor:pointer;position:relative;}
.img-upload:hover{border-color:var(--ac);}
.img-upload.has{border:none;padding:0;}
.img-upload.has img{width:100%;height:150px;object-fit:cover;border-radius:9px;}
.upload-icon{font-size:26px;margin-bottom:4px;}
.upload-text{font-size:11px;color:var(--dm);}
.img-change{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.6);color:white;border:none;border-radius:6px;padding:4px 8px;font-size:10px;cursor:pointer;}
.emoji-grid{display:flex;flex-wrap:wrap;gap:5px;}
.emoji-btn{width:38px;height:38px;border-radius:8px;background:var(--s2);border:2px solid var(--bd);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.emoji-btn.selected{border-color:var(--ac);background:rgba(124,106,247,0.12);}
.tag-group{display:flex;gap:6px;}
.tag-group input{flex:1;}
.tag-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.tag-item{display:flex;align-items:center;gap:2px;background:rgba(124,106,247,0.1);border:1px solid rgba(124,106,247,0.22);border-radius:20px;padding:3px 8px;font-size:11px;color:var(--ac);}
.tag-remove{background:none;border:none;color:var(--ac);cursor:pointer;font-size:11px;padding:0;}
.tag-add{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--dm);font-family:'Noto Sans KR',sans-serif;white-space:nowrap;}
.form-save{width:100%;background:linear-gradient(135deg,var(--ac),#a29bfe);border:none;border-radius:11px;padding:13px;color:white;font-size:14px;font-weight:500;cursor:pointer;}
.helper-btn{position:absolute;bottom:14px;right:14px;width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--ac),#a29bfe);border:none;color:white;font-size:22px;cursor:pointer;box-shadow:0 2px 8px rgba(124,106,247,0.2);z-index:40;}
.helper-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.helper-item{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center;cursor:pointer;}
.helper-item:active{border-color:var(--ac);background:rgba(124,106,247,0.1);}
.helper-name{font-size:13px;font-weight:500;}
.helper-desc{font-size:10px;color:var(--dm);margin-top:2px;}
.toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:9px 16px;font-size:11px;color:var(--tx);opacity:0;transition:all .22s;z-index:400;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.chat-header{height:52px;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:8px;position:relative;z-index:10;}
.chat-avatar{width:36px;height:36px;border-radius:8px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;}
.chat-avatar img{width:100%;height:100%;object-fit:cover;}
.chat-info{flex:1;min-width:0;}
.chat-name{font-family:'Nanum Myeongjo',serif;font-size:14px;font-weight:700;}
.chat-status{font-size:10px;color:var(--ac);margin-top:1px;}
.chat-close{background:none;border:none;color:var(--dm);font-size:18px;cursor:pointer;}
.messages{display:flex;flex-direction:column;gap:10px;padding:14px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;}
.msg{display:flex;gap:8px;max-width:85%;animation:msgIn .22s ease;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg.ai{align-self:flex-start;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:28px;height:28px;border-radius:7px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden;align-self:flex-end;}
.msg-avatar img{width:100%;height:100%;object-fit:cover;}
.msg-bubble{padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.msg.user .msg-bubble{background:rgba(124,106,247,0.2);border-radius:14px 3px 14px 14px;}
.msg.ai .msg-bubble{background:var(--s2);border-radius:3px 14px 14px 14px;}
.typing{display:flex;align-items:flex-end;gap:3px;padding:10px 13px;background:var(--s2);border-radius:14px;width:fit-content;}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--dm);animation:typing .6s infinite;}
.typing-dot:nth-child(2){animation-delay:.1s}
.typing-dot:nth-child(3){animation-delay:.2s}
@keyframes typing{0%,60%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-6px)}}
.chat-input{display:flex;gap:6px;padding:12px;background:var(--s1);border-top:1px solid var(--bd);}
.chat-textarea{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;color:var(--tx);font-size:13px;font-family:'Noto Sans KR',sans-serif;resize:none;max-height:100px;outline:none;}
.chat-textarea:focus{border-color:var(--ac);}
.chat-send{background:linear-gradient(135deg,var(--ac),#a29bfe);border:none;width:36px;height:36px;border-radius:9px;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.chat-send:disabled{opacity:.3;cursor:not-allowed;}
input[type="file"]{display:none;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">이야기 세계</div>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
  <div class="pages">
    <div class="page active" id="home">
      <div class="search-box"><span>🔍</span><input id="search" placeholder="캐릭터 검색..." oninput="updateHome()"></div>
      <div class="filter-scroll" id="filters"></div>
      <div class="grid" id="chars"></div>
    </div>
    <div class="page" id="make">
      <div class="make-header"><div class="make-title">캐릭터 제작</div></div>
      <div class="make-list" id="makeList"></div>
      <button class="fab" onclick="openMakeModal()">+</button>
    </div>
    <div class="page" id="chat">
      <div class="chat-header">
        <button class="chat-close" onclick="closeChat()">←</button>
        <div class="chat-avatar" id="chatAvatar"></div>
        <div class="chat-info"><div class="chat-name" id="chatName"></div><div class="chat-status">Colab EEVE</div></div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="chat-input">
        <textarea class="chat-textarea" id="chatInput" placeholder="메시지..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
        <button class="chat-send" id="sendBtn" onclick="sendMsg()">➤</button>
      </div>
    </div>
    <div class="page" id="my">
      <div class="my-content" id="myPage"></div>
    </div>
  </div>
  <nav class="tabbar">
    <button class="tab-btn active" onclick="switchPage('home')"><div class="tab-icon">🏠</div>홈</button>
    <button class="tab-btn" onclick="switchPage('make')"><div class="tab-icon">✚</div>제작</button>
    <button class="tab-btn" onclick="switchPage('my')"><div class="tab-icon">👤</div>마이</button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<input type="file" id="charFile" accept="image/*" onchange="uploadCharImg()">
<input type="file" id="bgFile" accept="image/*" onchange="uploadBgImg()">

<script>
const EMOJIS=['🧝','🧛','🧙','👸','🤺','🥷','👨‍🚀','🧜','🐉','🌙','⚔️','💀','🌹','🔮','🗡️','🌊','🔥','❄️','🎭','👁️','🦊','🐺','🌸','⚡','🏮'];
const GENRES=['전체','판타지','로맨스','호러','SF','현대','무협','학원','기타'];
const HELPERS={
  '성격':{
    '긍정적':['유쾌한','밝은','친근한','따뜻한','낙관적인'],
    '부정적':['우울한','음침한','냉소적','쓸쓸한','비관적인'],
    '중립적':['냉철한','담담한','무뚝뚝한','침착한','합리적인'],
  },
  '성별':{
    '여성':['여자아이','미성년여성','성인여성','할머니'],
    '남성':['남자아이','미성년남성','성인남성','할아버지'],
    '기타':['중성','안드로이드','초자연적존재'],
  },
  '직업':{
    '전투계':['검사','궁수','마법사','기사','군인'],
    '일반계':['의사','교사','상인','요리사','화가'],
    '신비계':['마녀','점쟁이','신관','마족','흡혈귀'],
    '학생':['초등학생','중학생','고등학생','대학생'],
  },
  '머리카락색':{
    '자연색':['검은색','갈색','회색','흰색'],
    '밝은색':['금색','노란색','주황색','빨간색'],
    '차가운색':['파란색','보라색','초록색','분홍색'],
  },
  '헤어스타일':{
    '롱헤어':['직머리','웨이브','곱슬머리','삼각머리','퍼머넌트'],
    '숏헤어':['단발','숏컷','머쉬룸컷','투블록'],
    '특수':['삐쳐진머리','쌍둥이머리','묶음머리','두갈래머리'],
  },
  '눈색':{
    '따뜻한색':['갈색','주황색','빨간색'],
    '차가운색':['파란색','녹색','보라색'],
    '신비색':['금색','은색','검은색','하얀색'],
  },
  '피부색':{
    '밝은':['창백한','밝은','투명한'],
    '어두운':['검은','어두운','햇빛탄'],
    '특이':['파란색','초록색','반투명'],
  },
  '키':{
    '작은':['키작은','앙증맞은','왜소한'],
    '평균':['평범한키','균형잡힌'],
    '큰':['키큰','우아한','위풍당당한'],
  },
};

let chars=[], filter='전체', isDark=true, selEmoji=EMOJIS[0], tmpImg=null, tmpBg=null, tmpTags=[];
let currentChar=null, chatHistory=[], isLoading=false;

function init(){
  chars=JSON.parse(localStorage.getItem('chars')||'[]');
  isDark=localStorage.getItem('theme')!=='light';
  applyTheme();
  updateHome();
  renderFilters();
  renderMy();
}

function applyTheme(){
  document.body.className=isDark?'':'light';
  document.querySelector('.theme-btn').textContent=isDark?'☀️':'🌙';
}

function toggleTheme(){isDark=!isDark;localStorage.setItem('theme',isDark?'dark':'light');applyTheme();}

function switchPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById(p).classList.add('active');
  event.target.closest('.tab-btn').classList.add('active');
  if(p==='make')renderMake();
}

function renderFilters(){
  const f=document.getElementById('filters');
  f.innerHTML='';
  GENRES.forEach(g=>{
    const b=document.createElement('button');
    b.className='filter-chip'+(g===filter?' active':'');
    b.textContent=g;
    b.onclick=()=>{filter=g;updateHome();}
    f.appendChild(b);
  });
}

function updateHome(){
  const search=document.getElementById('search').value.toLowerCase();
  const g=document.getElementById('chars');
  let filtered=chars.filter(c=>{
    const genreOk=filter==='전체'||c.genre===filter;
    const searchOk=!search||c.name.toLowerCase().includes(search)||c.desc.toLowerCase().includes(search);
    return genreOk&&searchOk;
  });
  if(!filtered.length){g.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📖</div><p>${chars.length?'검색 결과 없음':'캐릭터를 만들어보세요!'}</p></div>`;return;}
  g.innerHTML='';
  filtered.forEach(c=>{
    const idx=chars.indexOf(c);
    const card=document.createElement('div');
    card.className='card';
    const img=c.img?`<img src="${c.img}">`:`<span>${c.emoji}</span>`;
    card.innerHTML=`<div class="card-img">${img}<div class="card-genre">${c.genre}</div></div><div class="card-info"><div class="card-name">${c.name}</div><div class="card-desc">${c.desc}</div></div>`;
    card.onclick=()=>openChat(idx);
    g.appendChild(card);
  });
}

function renderMake(){
  const m=document.getElementById('makeList');
  if(!chars.length){m.innerHTML=`<div class="empty"><div class="empty-icon">✨</div><p>+ 버튼을 눌러 새 캐릭터를 만들어보세요!</p></div>`;return;}
  m.innerHTML='';
  chars.forEach((c,i)=>{
    const item=document.createElement('div');
    item.className='make-card';
    const av=c.img?`<img src="${c.img}">`:(c.emoji||'🧝');
    item.innerHTML=`<div class="make-avatar">${av}</div><div class="make-info"><div class="make-name">${c.name}</div><div class="make-stat">${c.genre}</div></div><div class="make-btns"><button class="make-btn" onclick="editChar(${i})">✏️</button><button class="make-btn del" onclick="delChar(${i})">🗑</button></div>`;
    m.appendChild(item);
  });
}

function renderMy(){
  const m=document.getElementById('myPage');
  m.innerHTML=`
    <div class="my-card">
      <div class="my-title">Colab URL</div>
      <input type="text" id="colabUrl" class="my-input" placeholder="https://xxxx-ngrok.io">
      <button class="my-btn" onclick="saveColabUrl()">저장</button>
    </div>
  `;
  document.getElementById('colabUrl').value=localStorage.getItem('colabUrl')||'';
}

function saveColabUrl(){
  let url=document.getElementById('colabUrl').value.trim();
  if(!url){toast('URL을 입력하세요');return;}
  if(!url.startsWith('http')){toast('http로 시작하는 전체 URL을 입력하세요');return;}
  if(!url.endsWith('/api/generate')){
    url=url.replace(/\/+$/,'')+'/api/generate';
  }
  localStorage.setItem('colabUrl',url);
  toast('✅ Colab URL 저장됨');
}

function openMakeModal(){
  selEmoji=EMOJIS[0];
  tmpImg=null;
  tmpBg=null;
  tmpTags=[];
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-handle"></div>
    <div class="modal-header"><div class="modal-title">캐릭터 만들기</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">이미지</label><div class="img-upload" id="imgUp" onclick="document.getElementById('charFile').click()"><div class="upload-icon">🖼️</div><div class="upload-text">탭해서 선택</div></div></div>
      <div class="form-group"><label class="form-label">이모지</label><div class="emoji-grid" id="emojiGr"></div></div>
      <div class="form-group"><label class="form-label">이름 *</label><input type="text" class="form-input" id="name"></div>
      <div class="form-group"><label class="form-label">장르</label><select class="form-select" id="genre"><option>판타지</option><option>로맨스</option><option>호러</option><option>SF</option><option>현대</option><option>무협</option><option>학원</option><option>기타</option></select></div>
      <div class="form-group"><label class="form-label">한 줄 소개</label><input type="text" class="form-input" id="desc"></div>
      <div class="form-group"><label class="form-label">해시태그</label><div class="tag-group"><input type="text" class="form-input" id="tagIn" placeholder="태그 입력" onkeydown="if(event.key==='Enter'){event.preventDefault();addTag()}"><button class="tag-add" onclick="addTag()">추가</button></div><div class="tag-list" id="tagLst"></div></div>
      <div class="form-group"><label class="form-label">캐릭터 설정 *</label><textarea class="form-textarea" id="persona" rows="6" placeholder="캐릭터의 성격, 말투, 배경 등을 입력하세요..."></textarea><button class="helper-btn" onclick="openHelper()">🎯</button></div>
      <div class="form-group"><label class="form-label">세계관/배경</label><textarea class="form-textarea" id="world" rows="3"></textarea></div>
      <div class="form-group"><label class="form-label">나(유저) 이름</label><input type="text" class="form-input" id="user"></div>
      <div class="form-group"><label class="form-label">첫 인사말</label><textarea class="form-textarea" id="greet" rows="3"></textarea></div>
    </div>
    <div class="modal-footer"><button class="form-save" onclick="saveCh()">저장</button></div>`;
  m.classList.add('active');
  document.getElementById('overlay').classList.add('active');
  renderEmoji();
  updateTags();
}

function renderEmoji(){
  const g=document.getElementById('emojiGr');
  g.innerHTML='';
  EMOJIS.forEach(e=>{
    const b=document.createElement('button');
    b.className='emoji-btn'+(e===selEmoji?' selected':'');
    b.textContent=e;
    b.onclick=()=>{document.querySelectorAll('.emoji-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selEmoji=e;};
    g.appendChild(b);
  });
}

function addTag(){
  const i=document.getElementById('tagIn');
  const v=i.value.trim().replace(/^#/,'');
  if(!v||tmpTags.includes(v))return;
  tmpTags.push(v);
  i.value='';
  updateTags();
}

function updateTags(){
  const l=document.getElementById('tagLst');
  l.innerHTML='';
  tmpTags.forEach(t=>{
    const item=document.createElement('div');
    item.className='tag-item';
    item.innerHTML=`#${t}<button class="tag-remove" onclick="tmpTags=tmpTags.filter(x=>x!=='${t}');updateTags();">✕</button>`;
    l.appendChild(item);
  });
}

function openHelper(){
  const m=document.getElementById('modal');
  let html='<div class="modal-handle"></div><div class="modal-header"><div class="modal-title">설정 도우미</div><button class="modal-close" onclick="reopenMake()">←</button></div><div class="modal-body"><div class="helper-grid" id="helperGr"></div></div>';
  m.innerHTML=html;
  renderHelperCat();
}

function renderHelperCat(){
  const g=document.getElementById('helperGr');
  g.innerHTML='';
  Object.keys(HELPERS).forEach(cat=>{
    const b=document.createElement('button');
    b.className='helper-item';
    b.innerHTML=`<div class="helper-name">${cat}</div><div class="helper-desc">선택</div>`;
    b.onclick=()=>renderHelperSub(cat);
    g.appendChild(b);
  });
}

function renderHelperSub(cat){
  const g=document.getElementById('helperGr');
  const d=HELPERS[cat];
  g.innerHTML='';
  const back=document.createElement('button');
  back.className='helper-item';
  back.style.gridColumn='1/-1';
  back.innerHTML='<div class="helper-name">← 뒤로</div>';
  back.onclick=()=>renderHelperCat();
  g.appendChild(back);
  Object.keys(d).forEach(sub=>{
    const b=document.createElement('button');
    b.className='helper-item';
    b.innerHTML=`<div class="helper-name">${sub}</div><div class="helper-desc">${d[sub].length}개</div>`;
    b.onclick=()=>renderHelperKw(cat,sub);
    g.appendChild(b);
  });
}

function renderHelperKw(cat,sub){
  const g=document.getElementById('helperGr');
  const kws=HELPERS[cat][sub];
  g.innerHTML='';
  const back=document.createElement('button');
  back.className='helper-item';
  back.style.gridColumn='1/-1';
  back.innerHTML='<div class="helper-name">← 뒤로</div>';
  back.onclick=()=>renderHelperSub(cat);
  g.appendChild(back);
  kws.forEach(kw=>{
    const b=document.createElement('button');
    b.className='helper-item';
    b.innerHTML=`<div class="helper-name">${kw}</div><div class="helper-desc">추가</div>`;
    b.onclick=()=>{
      const ta=document.getElementById('persona');
      if(ta.value)ta.value+='\n';
      ta.value+=`[${cat}-${sub}] ${kw}`;
      toast(`✅ "${kw}" 추가됨`);
    };
    g.appendChild(b);
  });
}

function uploadCharImg(){
  const f=document.getElementById('charFile').files[0];if(!f)return;
  const r=new FileReader();
  r.onload=(e)=>{tmpImg=e.target.result;document.getElementById('imgUp').classList.add('has');document.getElementById('imgUp').innerHTML=`<img src="${tmpImg}"><button class="img-change" onclick="event.stopPropagation();document.getElementById('charFile').click()">변경</button>`;};
  r.readAsDataURL(f);
}

function uploadBgImg(){
  const f=document.getElementById('bgFile').files[0];if(!f)return;
  const r=new FileReader();
  r.onload=(e)=>{tmpBg=e.target.result;};
  r.readAsDataURL(f);
}

function saveCh(){
  const n=document.getElementById('name').value.trim();
  const p=document.getElementById('persona').value.trim();
  if(!n){toast('이름을 입력하세요');return;}
  if(!p){toast('캐릭터 설정을 입력하세요');return;}
  const c={name:n,genre:document.getElementById('genre').value,desc:document.getElementById('desc').value.trim(),persona:p,world:document.getElementById('world').value.trim(),userName:document.getElementById('user').value.trim(),greeting:document.getElementById('greet').value.trim(),emoji:selEmoji,img:tmpImg,bg:tmpBg,tags:[...tmpTags]};
  chars.push(c);
  localStorage.setItem('chars',JSON.stringify(chars));
  closeModal();
  updateHome();
  renderMake();
  toast('✅ 저장됨');
}

function editChar(i){toast('편집 기능은 곧 추가됩니다!');}

function delChar(i){
  if(!confirm(`"${chars[i].name}" 을(를) 삭제?`))return;
  chars.splice(i,1);
  localStorage.setItem('chars',JSON.stringify(chars));
  renderMake();
  toast('삭제됨');
}

function reopenMake(){openMakeModal();}

function closeModal(){
  document.getElementById('modal').classList.remove('active');
  document.getElementById('overlay').classList.remove('active');
}

function openChat(idx){
  const colabUrl=localStorage.getItem('colabUrl');
  if(!colabUrl){toast('⚠️ 마이페이지에서 Colab URL 저장해주세요');return;}
  currentChar=chars[idx];
  chatHistory=[];
  switchPage('chat');
  document.getElementById('chatAvatar').innerHTML=(currentChar.img?`<img src="${currentChar.img}">`:currentChar.emoji)||'🧝';
  document.getElementById('chatName').textContent=currentChar.name;
  const msgs=document.getElementById('messages');
  msgs.innerHTML='';
  if(currentChar.greeting){
    addMsg('ai',currentChar.greeting);
  }
}

function closeChat(){
  currentChar=null;
  chatHistory=[];
  switchPage('home');
}

function addMsg(role,text){
  const msgs=document.getElementById('messages');
  const container=document.createElement('div');
  container.className=`msg ${role}`;
  const avatar=document.createElement('div');
  avatar.className='msg-avatar';
  avatar.innerHTML=(role==='ai'?(currentChar.img?`<img src="${currentChar.img}">`:currentChar.emoji||'🧝'):'👤');
  const bubble=document.createElement('div');
  bubble.className='msg-bubble';
  bubble.textContent=text;
  container.appendChild(avatar);
  container.appendChild(bubble);
  msgs.appendChild(container);
  msgs.scrollTop=msgs.scrollHeight;
}

function addTyping(){
  const msgs=document.getElementById('messages');
  const container=document.createElement('div');
  container.className='msg ai';
  container.id='typing';
  const avatar=document.createElement('div');
  avatar.className='msg-avatar';
  avatar.innerHTML=(currentChar.img?`<img src="${currentChar.img}">`:currentChar.emoji||'🧝');
  const bubble=document.createElement('div');
  bubble.className='typing';
  bubble.innerHTML='<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  container.appendChild(avatar);
  container.appendChild(bubble);
  msgs.appendChild(container);
  msgs.scrollTop=msgs.scrollHeight;
}

function removeTyping(){
  const t=document.getElementById('typing');
  if(t)t.remove();
}

async function sendMsg(){
  const inp=document.getElementById('chatInput');
  const txt=inp.value.trim();
  if(!txt||isLoading)return;
  
  const colabUrl=localStorage.getItem('colabUrl');
  if(!colabUrl){toast('⚠️ Colab URL을 저장해주세요');return;}
  
  addMsg('user',txt);
  chatHistory.push({role:'user',content:txt});
  inp.value='';
  inp.style.height='auto';
  
  isLoading=true;
  document.getElementById('sendBtn').disabled=true;
  addTyping();
  
  try{
    const prompt=`[캐릭터: ${currentChar.name}]
[설정]
${currentChar.persona}

[배경]
${currentChar.world||''}

[상대방 이름]
${currentChar.userName||'사용자'}

[지시사항]
- 절대 AI임을 밝히지 마라
- ${currentChar.name}의 성격과 말투를 유지해라
- 한국어로 자연스럽게 대화해라

[대화 기록]
${chatHistory.map(h=>`${h.role==='user'?currentChar.userName||'사용자':currentChar.name}: ${h.content}`).join('\n')}

${currentChar.userName||'사용자'}: ${txt}

${currentChar.name}:`;

    const response=await fetch(colabUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'eeve:latest',prompt:prompt,stream:false})
    });

    if(!response.ok){removeTyping();toast('❌ 연결 오류: '+(response.status||'?'));isLoading=false;document.getElementById('sendBtn').disabled=false;return;}
    
    const data=await response.json();
    removeTyping();
    const reply=data.response.trim();
    addMsg('ai',reply);
    chatHistory.push({role:'assistant',content:reply});
  }catch(e){
    removeTyping();
    toast('❌ '+e.message);
  }
  
  isLoading=false;
  document.getElementById('sendBtn').disabled=false;
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

document.getElementById('overlay').addEventListener('click',closeModal);

init();
</script>
</body>
</html>
