<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이야기 세계</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090e;--s1:#111117;--s2:#17171f;--s3:#1e1e28;--bd:#222230;--ac:#7c6af7;--ac2:#a29bfe;--tx:#e0e0ea;--dm:#5a5a7a;--red:#e17055;--th:60px;--hh:52px;}
.light{--bg:#f5f5fa;--s1:#ffffff;--s2:#f0f0f7;--s3:#e8e8f0;--bd:#d8d8e8;--ac:#7c6af7;--tx:#1a1a2e;--dm:#888899;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;}
.app{width:100%;height:100%;display:flex;flex-direction:column;}
.header{height:var(--hh);background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:8px;}
.title{font-family:'Nanum Myeongjo',serif;font-size:21px;font-weight:800;flex:1;}
.hbtn{background:none;border:none;color:var(--dm);cursor:pointer;font-size:18px;padding:8px;border-radius:8px;}
.content{flex:1;overflow:hidden;}
.page{display:none;width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.page.show{display:block;}
.tabbar{position:fixed;bottom:0;left:0;right:0;height:var(--th);background:var(--s1);border-top:1px solid var(--bd);display:flex;z-index:100;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--dm);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:12px;}
.tab.active{color:var(--ac);}
.tab-icon{font-size:21px;}

/* 홈 페이지 */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:12px 14px;}
.search-bar input{flex:1;background:none;border:none;color:var(--tx);font-size:13px;outline:none;}
.search-bar input::placeholder{color:var(--dm);}
.filter-bar{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:11px;background:var(--s2);border:1px solid var(--bd);color:var(--dm);cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;}
.filter-btn.active{background:rgba(124,106,247,0.15);border-color:var(--ac);color:var(--ac);}
.char-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 80px;}
.char-card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;}
.char-img{width:100%;aspect-ratio:3/4;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden;}
.char-img img{width:100%;height:100%;object-fit:cover;}
.char-genre{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);border-radius:6px;padding:2px 7px;font-size:9px;color:#fff;}
.char-info{padding:10px 11px;}
.char-name{font-family:'Nanum Myeongjo',serif;font-size:15px;font-weight:700;margin-bottom:3px;}
.char-desc{font-size:11px;color:var(--dm);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.empty{text-align:center;padding:60px 20px;color:var(--dm);}
.empty-icon{font-size:48px;margin-bottom:12px;}

/* 제작 페이지 */
.make-header{padding:16px;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;}
.make-title{font-family:'Nanum Myeongjo',serif;font-size:18px;font-weight:800;}
.make-content{padding:14px 12px 90px;}
.make-item{background:var(--s1);border:1px solid var(--bd);border-radius:14px;display:flex;align-items:center;gap:11px;padding:13px;margin-bottom:8px;}
.make-avatar{width:46px;height:46px;border-radius:11px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.make-avatar img{width:100%;height:100%;object-fit:cover;}
.make-info{flex:1;}
.make-name{font-size:14px;font-weight:500;}
.make-stat{font-size:11px;color:var(--dm);margin-top:2px;}
.make-actions{display:flex;gap:4px;}
.action-btn{background:none;border:none;color:var(--dm);cursor:pointer;font-size:15px;padding:6px;}
.action-btn.del:hover{color:var(--red);}
.fab{position:fixed;bottom:calc(var(--th)+14px);right:16px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));border:none;color:white;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(124,106,247,0.2);display:flex;align-items:center;justify-content:center;z-index:50;}
.fab:active{transform:scale(0.92);}

/* 마이페이지 */
.my-content{padding:14px;}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);z-index:200;display:none;}
.modal-bg.active{display:block;}
.modal{position:fixed;bottom:0;left:0;right:0;width:100%;max-height:95dvh;background:var(--s1);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:slideUp .27s ease;z-index:201;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:30px;height:4px;background:var(--bd);border-radius:2px;margin:9px auto 0;}
.modal-header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);}
.modal-title{font-family:'Nanum Myeongjo',serif;font-size:17px;font-weight:700;flex:1;}
.modal-close{background:none;border:none;color:var(--dm);font-size:20px;cursor:pointer;}
.modal-body{flex:1;overflow-y:auto;padding:14px;}
.modal-footer{padding:12px 14px;border-top:1px solid var(--bd);padding-bottom:calc(12px + env(safe-area-inset-bottom));}
.form-group{margin-bottom:14px;}
.form-label{font-size:10px;color:var(--dm);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:block;font-weight:600;}
.form-input,.form-textarea,.form-select{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;color:var(--tx);font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--ac);}
.form-textarea{resize:none;line-height:1.6;}
.form-select option{background:var(--s2);}
.img-upload{border:2px dashed var(--bd);border-radius:11px;padding:18px;text-align:center;cursor:pointer;position:relative;}
.img-upload:hover{border-color:var(--ac);}
.img-upload.has{border-style:solid;padding:0;}
.img-upload.has img{width:100%;height:150px;object-fit:cover;border-radius:9px;}
.upload-icon{font-size:26px;margin-bottom:4px;}
.upload-text{font-size:11px;color:var(--dm);}
.img-change{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.6);color:white;border:none;border-radius:6px;padding:4px 8px;font-size:10px;cursor:pointer;}
.emoji-grid{display:flex;flex-wrap:wrap;gap:5px;}
.emoji-btn{width:38px;height:38px;border-radius:8px;background:var(--s2);border:2px solid var(--bd);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.emoji-btn.selected{border-color:var(--ac);background:rgba(124,106,247,0.12);}
.tag-input-group{display:flex;gap:6px;}
.tag-input-group input{flex:1;}
.tag-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.tag-item{display:flex;align-items:center;gap:2px;background:rgba(124,106,247,0.1);border:1px solid rgba(124,106,247,0.22);border-radius:20px;padding:3px 8px;font-size:11px;color:var(--ac);}
.tag-remove{background:none;border:none;color:var(--ac);cursor:pointer;font-size:11px;padding:0;}
.form-save{width:100%;background:linear-gradient(135deg,var(--ac),var(--ac2));border:none;border-radius:11px;padding:13px;color:white;font-size:14px;font-weight:500;cursor:pointer;}
.toast{position:fixed;bottom:calc(var(--th)+10px);left:50%;transform:translateX(-50%) translateY(10px);background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:9px 16px;font-size:11px;color:var(--tx);opacity:0;transition:all .22s;z-index:400;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 도우미 버튼 */
.helper-btn{position:absolute;bottom:14px;right:14px;width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));border:none;color:white;font-size:22px;cursor:pointer;box-shadow:0 2px 8px rgba(124,106,247,0.2);z-index:40;}
.helper-btn:active{transform:scale(0.92);}

/* 도우미 패널 */
.helper-bg{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);z-index:199;display:none;}
.helper-bg.active{display:block;}
.helper-modal{position:fixed;bottom:0;left:0;right:0;width:100%;max-height:90dvh;background:var(--s1);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:slideUp .27s ease;z-index:200;}
.helper-header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);}
.helper-back{background:none;border:none;color:var(--dm);font-size:18px;cursor:pointer;padding:6px;}
.helper-title{font-family:'Nanum Myeongjo',serif;font-size:17px;font-weight:700;flex:1;margin-left:8px;}
.helper-close{background:none;border:none;color:var(--dm);font-size:20px;cursor:pointer;}
.helper-body{flex:1;overflow-y:auto;padding:14px;}
.helper-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.helper-item{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center;cursor:pointer;}
.helper-item:active{transform:scale(0.96);border-color:var(--ac);background:rgba(124,106,247,0.1);}
.helper-name{font-size:13px;font-weight:500;color:var(--tx);}
.helper-desc{font-size:10px;color:var(--dm);margin-top:2px;}

input[type="file"]{display:none;}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <div class="title">이야기 세계</div>
  <button class="hbtn" id="themeBtn" onclick="toggleTheme()">🌙</button>
</div>
<div class="content">
  <div class="page show" id="page-home">
    <div class="search-bar"><span>🔍</span><input id="searchInput" placeholder="캐릭터 검색..." oninput="filterChars()"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="char-grid" id="charGrid"></div>
  </div>
  <div class="page" id="page-make">
    <div class="make-header"><div class="make-title">캐릭터 제작</div></div>
    <div class="make-content" id="makeContent"></div>
    <button class="fab" onclick="openMakeModal()">+</button>
  </div>
  <div class="page" id="page-my">
    <div class="my-content" id="myContent"></div>
  </div>
</div>
<nav class="tabbar">
  <button class="tab active" onclick="switchTab(0)"><div class="tab-icon">🏠</div>홈</button>
  <button class="tab" onclick="switchTab(1)"><div class="tab-icon">✚</div>제작</button>
  <button class="tab" onclick="switchTab(2)"><div class="tab-icon">👤</div>마이</button>
</nav>
</div>

<!-- 모달 -->
<div class="modal-bg" id="modalBg"></div>
<div class="modal" id="makeModal" style="display:none;"></div>

<!-- 도우미 -->
<div class="helper-bg" id="helperBg"></div>
<div class="helper-modal" id="helperModal" style="display:none;"></div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<!-- 파일 입력 -->
<input type="file" id="charImg" accept="image/*" onchange="handleCharImg()">
<input type="file" id="bgImg" accept="image/*" onchange="handleBgImg()">
<input type="file" id="profImg" accept="image/*" onchange="handleProfImg()">

<script>
const EMOJIS=['🧝','🧛','🧙','👸','🤺','🥷','👨‍🚀','🧜','🐉','🌙','⚔️','💀','🌹','🔮','🗡️','🌊','🔥','❄️','🎭','👁️','🦊','🐺','🌸','⚡','🏮'];
const GENRES=['전체','판타지','로맨스','호러','SF','현대','무협','학원','기타'];

const HELPERS={
  '성격':{
    '긍정적':['유쾌한','밝은','친근한','따뜻한','낙관적인'],
    '부정적':['우울한','음침한','냉소적','쓸쓸한','비관적인'],
    '중립적':['냉철한','담담한','무뚝뚝한','침착한','합리적인'],
  },
  '성별':{
    '여성':['여자아이','미성년여성','성인여성','할머니'],
    '남성':['남자아이','미성년남성','성인남성','할아버지'],
    '기타':['중성','안드로이드','초자연적존재'],
  },
  '직업':{
    '전투계':['검사','궁수','마법사','기사','군인'],
    '일반계':['의사','교사','상인','요리사','화가'],
    '신비계':['마녀','점쟁이','신관','마족','흡혈귀'],
    '학생':['초등학생','중학생','고등학생','대학생'],
  },
  '머리카락색':{
    '자연색':['검은색','갈색','회색','흰색'],
    '밝은색':['금색','노란색','주황색','빨간색'],
    '차가운색':['파란색','보라색','초록색','분홍색'],
  },
  '헤어스타일':{
    '롱헤어':['직머리','웨이브','곱슬머리','삼각머리','퍼머넌트'],
    '숏헤어':['단발','숏컷','머쉬룸컷','투블록'],
    '특수':['삐쳐진머리','쌍둥이머리','묶음머리','두갈래머리'],
  },
  '눈색':{
    '따뜻한색':['갈색','주황색','빨간색'],
    '차가운색':['파란색','녹색','보라색'],
    '신비색':['금색','은색','검은색','하얀색'],
  },
  '피부색':{
    '밝은':['창백한','밝은','투명한'],
    '어두운':['검은','어두운','햇빛탄'],
    '특이':['파란색','초록색','반투명'],
  },
  '키':{
    '작은':['키작은','앙증맞은','왜소한'],
    '평균':['평범한키','균형잡힌'],
    '큰':['키큰','우아한','위풍당당한'],
  },
};

let chars=[];let filter='전체';let search='';let isDark=true;let emoji=EMOJIS[0];let cimg=null;let bimg=null;let tags=[];

function init(){
  chars=JSON.parse(localStorage.getItem('chars')||'[]');
  isDark=localStorage.getItem('theme')!=='light';
  applyTheme();
  render();
}

function applyTheme(){
  document.body.className=isDark?'':'light';
  document.getElementById('themeBtn').textContent=isDark?'☀️':'🌙';
}

function toggleTheme(){isDark=!isDark;localStorage.setItem('theme',isDark?'dark':'light');applyTheme();}

function switchTab(i){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const pages=['page-home','page-make','page-my'];
  document.getElementById(pages[i]).classList.add('show');
  document.querySelectorAll('.tab')[i].classList.add('active');
  if(i===1)renderMake();
  if(i===2)renderMy();
}

function render(){
  renderFilter();
  const grid=document.getElementById('charGrid');
  let f=chars.filter(c=>{
    const mg=filter==='전체'||c.genre===filter;
    const ms=!search||c.name.toLowerCase().includes(search)||c.desc.toLowerCase().includes(search);
    return mg&&ms;
  });
  if(!f.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📖</div><p>${chars.length?'검색 결과 없음':'캐릭터를 만들어보세요!'}</p></div>`;return;}
  grid.innerHTML='';
  f.forEach(c=>{
    const idx=chars.indexOf(c);
    const card=document.createElement('div');
    card.className='char-card';
    const img=c.img?`<img src="${c.img}">`:`<span>${c.emoji}</span>`;
    card.innerHTML=`<div class="char-img">${img}<div class="char-genre">${c.genre}</div></div><div class="char-info"><div class="char-name">${c.name}</div><div class="char-desc">${c.desc}</div></div>`;
    grid.appendChild(card);
  });
}

function renderFilter(){
  const bar=document.getElementById('filterBar');
  bar.innerHTML='';
  GENRES.forEach(g=>{
    const btn=document.createElement('button');
    btn.className='filter-btn'+(g===filter?' active':'');
    btn.textContent=g;
    btn.onclick=()=>{filter=g;render();}
    bar.appendChild(btn);
  });
}

function filterChars(){
  search=document.getElementById('searchInput').value.toLowerCase();
  render();
}

function renderMake(){
  const c=document.getElementById('makeContent');
  if(!chars.length){c.innerHTML=`<div class="empty"><div class="empty-icon">✨</div><p>+ 버튼을 눌러 새 캐릭터를 만들어보세요!</p></div>`;return;}
  c.innerHTML='';
  chars.forEach((ch,i)=>{
    const item=document.createElement('div');
    item.className='make-item';
    const av=ch.img?`<img src="${ch.img}">`:(ch.emoji||'🧝');
    item.innerHTML=`<div class="make-avatar">${av}</div><div class="make-info"><div class="make-name">${ch.name}</div><div class="make-stat">${ch.genre}</div></div><div class="make-actions"><button class="action-btn" onclick="editChar(${i})">✏️</button><button class="action-btn del" onclick="delChar(${i})">🗑</button></div>`;
    c.appendChild(item);
  });
}

function renderMy(){
  const c=document.getElementById('myContent');
  const p=JSON.parse(localStorage.getItem('prof')||'{"name":"사용자","id":"@user"}');
  c.innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-family:'Nanum Myeongjo',serif;font-size:18px;font-weight:700">${p.name}</div>
      <div style="font-size:12px;color:var(--dm);margin-top:4px">${p.id}</div>
    </div>
    <div style="background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px">
      <div style="font-size:10px;color:var(--dm);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">API 설정</div>
      <input type="password" id="apiK" placeholder="gsk_..." style="width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;color:var(--tx);font-size:12px;margin-bottom:8px;outline:none;font-family:monospace">
      <button onclick="saveApi()" style="width:100%;background:var(--ac);color:white;border:none;border-radius:9px;padding:10px;cursor:pointer;font-weight:500;font-family:'Noto Sans KR',sans-serif">저장</button>
    </div>
  `;
  const ak=document.getElementById('apiK');
  if(ak)ak.value=localStorage.getItem('apiK')||'';
}

function saveApi(){
  const k=document.getElementById('apiK').value.trim();
  if(!k){toast('API 키를 입력하세요');return;}
  localStorage.setItem('apiK',k);
  toast('✅ API 키 저장됨');
}

function openMakeModal(){
  emoji=EMOJIS[0];
  cimg=null;
  bimg=null;
  tags=[];
  const m=document.getElementById('makeModal');
  m.innerHTML=`<div class="modal-handle"></div>
    <div class="modal-header"><div class="modal-title">캐릭터 만들기</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">이미지</label>
        <div class="img-upload" id="cimgUp" onclick="document.getElementById('charImg').click()"><div class="upload-icon">🖼️</div><div class="upload-text">탭해서 선택</div></div>
      </div>
      <div class="form-group">
        <label class="form-label">이모지</label>
        <div class="emoji-grid" id="emojiGr"></div>
      </div>
      <div class="form-group">
        <label class="form-label">이름 *</label>
        <input type="text" class="form-input" id="cname" placeholder="예: 이설, 아라...">
      </div>
      <div class="form-group">
        <label class="form-label">장르</label>
        <select class="form-select" id="cgenre"><option>판타지</option><option>로맨스</option><option>호러</option><option>SF</option><option>현대</option><option>무협</option><option>학원</option><option>기타</option></select>
      </div>
      <div class="form-group">
        <label class="form-label">한 줄 소개</label>
        <input type="text" class="form-input" id="cdesc" placeholder="예: 냉혹한 마검사...">
      </div>
      <div class="form-group">
        <label class="form-label">해시태그</label>
        <div class="tag-input-group">
          <input type="text" class="form-input" id="tagIn" placeholder="태그 입력" onkeydown="if(event.key==='Enter'){event.preventDefault();addTag()}">
          <button onclick="addTag()" style="background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--dm);font-family:'Noto Sans KR',sans-serif">추가</button>
        </div>
        <div class="tag-list" id="tagLst"></div>
      </div>
      <div class="form-group">
        <label class="form-label">캐릭터 설정 *</label>
        <textarea class="form-textarea" id="cper" rows="6" placeholder="캐릭터의 성격, 말투, 배경 등을 입력하세요..."></textarea>
        <button class="helper-btn" onclick="openHelper()">🎯</button>
      </div>
      <div class="form-group">
        <label class="form-label">세계관/배경</label>
        <textarea class="form-textarea" id="cworld" rows="3" placeholder="세계관, 상황 설명..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">채팅 배경 이미지</label>
        <div class="img-upload" id="bimgUp" onclick="document.getElementById('bgImg').click()"><div class="upload-icon">🌄</div><div class="upload-text">배경 이미지 선택</div></div>
      </div>
      <div class="form-group">
        <label class="form-label">나(유저) 이름</label>
        <input type="text" class="form-input" id="cusr" placeholder="예: 셀레나, 용사...">
      </div>
      <div class="form-group">
        <label class="form-label">첫 인사말</label>
        <textarea class="form-textarea" id="cgreet" rows="3" placeholder="캐릭터 첫 마디..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="form-save" onclick="saveCh()">저장</button>
    </div>`;
  m.style.display='flex';
  document.getElementById('modalBg').classList.add('active');
  renderEmoji();
  renderTags();
}

function renderEmoji(){
  const g=document.getElementById('emojiGr');
  g.innerHTML='';
  EMOJIS.forEach(e=>{
    const b=document.createElement('button');
    b.className='emoji-btn'+(e===emoji?' selected':'');
    b.textContent=e;
    b.onclick=()=>{
      document.querySelectorAll('.emoji-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      emoji=e;
    };
    g.appendChild(b);
  });
}

function addTag(){
  const i=document.getElementById('tagIn');
  const v=i.value.trim().replace(/^#/,'');
  if(!v||tags.includes(v))return;
  tags.push(v);
  i.value='';
  renderTags();
}

function renderTags(){
  const l=document.getElementById('tagLst');
  l.innerHTML='';
  tags.forEach(t=>{
    const item=document.createElement('div');
    item.className='tag-item';
    item.innerHTML=`#${t}<button class="tag-remove" onclick="tags=tags.filter(x=>x!=='${t}');renderTags();">✕</button>`;
    l.appendChild(item);
  });
}

function openHelper(){
  const h=document.getElementById('helperModal');
  h.innerHTML=`<div class="helper-header"><div class="helper-title">설정 도우미</div><button class="helper-close" onclick="closeHelper()">✕</button></div><div class="helper-body"><div class="helper-grid" id="helperGr"></div></div>`;
  h.style.display='flex';
  document.getElementById('helperBg').classList.add('active');
  renderHelperCat();
}

function renderHelperCat(){
  const g=document.getElementById('helperGr');
  g.innerHTML='';
  Object.keys(HELPERS).forEach(cat=>{
    const b=document.createElement('button');
    b.className='helper-item';
    b.innerHTML=`<div class="helper-name">${cat}</div><div class="helper-desc">선택하기</div>`;
    b.onclick=()=>renderHelperSub(cat);
    g.appendChild(b);
  });
}

function renderHelperSub(cat){
  const g=document.getElementById('helperGr');
  const data=HELPERS[cat];
  g.innerHTML='';
  
  const back=document.createElement('button');
  back.className='helper-item';
  back.style.gridColumn='1/-1';
  back.innerHTML=`<div class="helper-name">← 뒤로가기</div>`;
  back.onclick=()=>renderHelperCat();
  g.appendChild(back);
  
  Object.keys(data).forEach(sub=>{
    const b=document.createElement('button');
    b.className='helper-item';
    b.innerHTML=`<div class="helper-name">${sub}</div><div class="helper-desc">${data[sub].length}개</div>`;
    b.onclick=()=>renderHelperKw(cat,sub);
    g.appendChild(b);
  });
}

function renderHelperKw(cat,sub){
  const g=document.getElementById('helperGr');
  const kws=HELPERS[cat][sub];
  g.innerHTML='';
  
  const back=document.createElement('button');
  back.className='helper-item';
  back.style.gridColumn='1/-1';
  back.innerHTML=`<div class="helper-name">← 뒤로가기</div>`;
  back.onclick=()=>renderHelperSub(cat);
  g.appendChild(back);
  
  kws.forEach(kw=>{
    const b=document.createElement('button');
    b.className='helper-item';
    b.innerHTML=`<div class="helper-name">${kw}</div><div class="helper-desc">추가하기</div>`;
    b.onclick=()=>{
      const ta=document.getElementById('cper');
      if(ta.value)ta.value+='\n';
      ta.value+=`[${cat}-${sub}] ${kw}`;
      toast(`✅ "${kw}" 추가됨`);
      b.style.background='rgba(124,106,247,0.2)';
    };
    g.appendChild(b);
  });
}

function handleCharImg(){
  const f=document.getElementById('charImg').files[0];if(!f)return;
  const r=new FileReader();
  r.onload=(e)=>{
    cimg=e.target.result;
    document.getElementById('cimgUp').classList.add('has');
    document.getElementById('cimgUp').innerHTML=`<img src="${cimg}"><button class="img-change" onclick="event.stopPropagation();document.getElementById('charImg').click()">변경</button>`;
  };
  r.readAsDataURL(f);
}

function handleBgImg(){
  const f=document.getElementById('bgImg').files[0];if(!f)return;
  const r=new FileReader();
  r.onload=(e)=>{
    bimg=e.target.result;
    document.getElementById('bimgUp').classList.add('has');
    document.getElementById('bimgUp').innerHTML=`<img src="${bimg}"><button class="img-change" onclick="event.stopPropagation();document.getElementById('bgImg').click()">변경</button>`;
  };
  r.readAsDataURL(f);
}

function handleProfImg(){
  const f=document.getElementById('profImg').files[0];if(!f)return;
  const r=new FileReader();
  r.onload=(e)=>{
    const p=JSON.parse(localStorage.getItem('prof')||'{}');
    p.img=e.target.result;
    localStorage.setItem('prof',JSON.stringify(p));
    toast('✅ 프로필 저장됨');
  };
  r.readAsDataURL(f);
}

function saveCh(){
  const n=document.getElementById('cname').value.trim();
  const per=document.getElementById('cper').value.trim();
  if(!n){toast('이름을 입력하세요');return;}
  if(!per){toast('캐릭터 설정을 입력하세요');return;}
  
  const c={
    name:n,genre:document.getElementById('cgenre').value,
    desc:document.getElementById('cdesc').value.trim(),
    persona:per,world:document.getElementById('cworld').value.trim(),
    userName:document.getElementById('cusr').value.trim(),
    greeting:document.getElementById('cgreet').value.trim(),
    emoji,img:cimg,bg:bimg,tags:[...tags]
  };
  chars.push(c);
  localStorage.setItem('chars',JSON.stringify(chars));
  closeModal();
  render();
  renderMake();
  toast('✅ 저장됨');
}

function editChar(i){toast('편집 기능은 곧 추가됩니다!');}

function delChar(i){
  if(!confirm(`"${chars[i].name}" 을(를) 삭제하시겠습니까?`))return;
  chars.splice(i,1);
  localStorage.setItem('chars',JSON.stringify(chars));
  renderMake();
  toast('삭제됨');
}

function closeModal(){
  document.getElementById('makeModal').style.display='none';
  document.getElementById('modalBg').classList.remove('active');
}

function closeHelper(){
  document.getElementById('helperModal').style.display='none';
  document.getElementById('helperBg').classList.remove('active');
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

document.getElementById('modalBg').addEventListener('click',closeModal);
document.getElementById('helperBg').addEventListener('click',closeHelper);

init();
</script>
</body>
</html>
