<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이야기 세계</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;font-family:'Noto Sans KR',sans-serif;}
body{background:#0a0a0e;color:#e0e0ea;overflow:hidden;}
.app{display:flex;flex-direction:column;width:100%;height:100%;}
.header{height:50px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 16px;gap:12px;}
.title{font-size:20px;font-weight:700;flex:1;}
.btn-theme{background:none;border:none;color:#888;font-size:18px;cursor:pointer;}
.pages{flex:1;overflow:hidden;}
.page{display:none;width:100%;height:100%;flex-direction:column;}
.page.active{display:flex;}
.tabbar{height:60px;background:#111;border-top:1px solid #222;display:flex;}
.tab{flex:1;background:none;border:none;color:#888;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;}
.tab.active{color:#7c6af7;}
.tab-icon{font-size:20px;}

/* HOME */
.search{display:flex;align-items:center;gap:8px;background:#17171f;border:1px solid #222;border-radius:10px;padding:10px 12px;margin:12px;height:40px;}
.search input{flex:1;background:none;border:none;color:#e0e0ea;font-size:13px;outline:none;}
.filters{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;}
.filter{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:11px;background:#17171f;border:1px solid #222;color:#888;cursor:pointer;}
.filter.active{background:rgba(124,106,247,0.15);border-color:#7c6af7;color:#7c6af7;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 80px;}
.card{background:#17171f;border:1px solid #222;border-radius:12px;cursor:pointer;overflow:hidden;}
.card-img{width:100%;aspect-ratio:3/4;background:#222;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:cover;}
.card-info{padding:10px;}
.card-name{font-size:14px;font-weight:600;margin-bottom:3px;}
.card-desc{font-size:11px;color:#888;}

/* MAKE */
.make-header{padding:14px 16px;border-bottom:1px solid #222;}
.make-list{flex:1;overflow-y:auto;padding:0 12px 80px;}
.make-item{background:#17171f;border:1px solid #222;border-radius:10px;display:flex;gap:10px;padding:12px;margin-bottom:8px;align-items:center;}
.avatar{width:44px;height:44px;border-radius:8px;background:#222;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.info{flex:1;}
.info-name{font-size:13px;font-weight:600;}
.info-genre{font-size:10px;color:#888;margin-top:2px;}
.btns{display:flex;gap:4px;}
.btn-small{background:none;border:none;color:#888;cursor:pointer;font-size:14px;padding:4px;}
.fab{position:fixed;bottom:74px;right:16px;width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,#7c6af7,#a29bfe);border:none;color:white;font-size:24px;cursor:pointer;z-index:40;}

/* CHAT */
.chat-header{height:50px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 12px;gap:8px;}
.back-btn{background:none;border:none;color:#e0e0ea;font-size:18px;cursor:pointer;}
.chat-avatar{width:34px;height:34px;border-radius:8px;background:#222;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;overflow:hidden;}
.chat-avatar img{width:100%;height:100%;object-fit:cover;}
.chat-info{flex:1;}
.chat-name{font-size:13px;font-weight:600;}
.chat-status{font-size:9px;color:#7c6af7;margin-top:1px;}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;}
.msg{display:flex;gap:6px;max-width:85%;animation:slideIn .2s ease;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg.ai{align-self:flex-start;}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:24px;height:24px;border-radius:6px;background:#222;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;overflow:hidden;}
.msg-avatar img{width:100%;height:100%;object-fit:cover;}
.msg-bubble{padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.5;word-break:break-word;white-space:pre-wrap;}
.msg.user .msg-bubble{background:rgba(124,106,247,0.2);border-radius:12px 4px 12px 12px;}
.msg.ai .msg-bubble{background:#222;border-radius:4px 12px 12px 12px;}
.typing{display:flex;gap:3px;align-items:flex-end;padding:10px 12px;background:#222;border-radius:12px;width:fit-content;}
.dot{width:5px;height:5px;border-radius:50%;background:#888;animation:blink .6s infinite;}
.dot:nth-child(2){animation-delay:.1s}
.dot:nth-child(3){animation-delay:.2s}
@keyframes blink{0%,60%{opacity:.3}30%{opacity:1}}
.chat-input{display:flex;gap:6px;padding:12px;background:#111;border-top:1px solid #222;}
.input-area{flex:1;background:#17171f;border:1px solid #222;border-radius:10px;padding:8px 12px;display:flex;align-items:center;}
.input-area textarea{flex:1;background:none;border:none;color:#e0e0ea;font-size:13px;font-family:'Noto Sans KR';resize:none;max-height:80px;outline:none;}
.btn-send{width:34px;height:34px;border-radius:8px;background:#7c6af7;border:none;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.btn-send:disabled{opacity:.3;cursor:not-allowed;}

/* MY */
.my-content{flex:1;overflow-y:auto;padding:12px;}
.my-card{background:#17171f;border:1px solid #222;border-radius:10px;padding:14px;margin-bottom:10px;}
.my-label{font-size:10px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;font-weight:600;}
.my-input{width:100%;background:#222;border:1px solid #333;border-radius:8px;padding:10px;color:#e0e0ea;font-size:12px;font-family:monospace;outline:none;margin-bottom:8px;}
.my-btn{width:100%;background:#7c6af7;border:none;border-radius:8px;padding:10px;color:white;cursor:pointer;font-weight:600;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;}
.overlay.active{display:block;}
.modal{position:fixed;bottom:0;left:0;right:0;width:100%;max-height:90vh;background:#17171f;border-radius:20px 20px 0 0;display:none;flex-direction:column;animation:slideUp .3s ease;z-index:101;}
.modal.active{display:flex;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;padding:16px;border-bottom:1px solid #222;}
.modal-title{font-size:16px;font-weight:700;flex:1;}
.modal-close{background:none;border:none;color:#888;font-size:18px;cursor:pointer;}
.modal-body{flex:1;overflow-y:auto;padding:16px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:10px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:block;font-weight:600;}
.form-input,.form-textarea,.form-select{width:100%;background:#222;border:1px solid #333;border-radius:8px;padding:10px;color:#e0e0ea;font-size:12px;font-family:'Noto Sans KR';outline:none;}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:#7c6af7;}
.form-textarea{resize:none;line-height:1.6;}
.img-upload{border:2px dashed #333;border-radius:8px;padding:16px;text-align:center;cursor:pointer;}
.img-upload.has img{width:100%;height:120px;object-fit:cover;border-radius:6px;}
.emojis{display:flex;flex-wrap:wrap;gap:4px;}
.emoji-btn{width:36px;height:36px;border-radius:6px;background:#222;border:2px solid #333;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.emoji-btn.sel{border-color:#7c6af7;background:rgba(124,106,247,.1);}
.form-save{width:100%;background:linear-gradient(135deg,#7c6af7,#a29bfe);border:none;border-radius:8px;padding:12px;color:white;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;border:1px solid #333;border-radius:8px;padding:8px 14px;font-size:11px;color:#e0e0ea;opacity:0;transition:opacity .2s;z-index:200;}
.toast.show{opacity:1;}

input[type="file"]{display:none;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">이야기 세계</div>
    <button class="btn-theme" onclick="toggleTheme()">🌙</button>
  </div>
  
  <div class="pages">
    <div class="page active" id="home">
      <div class="search"><span>🔍</span><input id="search" placeholder="검색..." oninput="filterHome()"></div>
      <div class="filters" id="filters"></div>
      <div class="grid" id="grid"></div>
    </div>
    
    <div class="page" id="make">
      <div class="make-header"><div class="title">캐릭터 제작</div></div>
      <div class="make-list" id="makeList"></div>
      <button class="fab" onclick="openMake()">+</button>
    </div>
    
    <div class="page" id="chat">
      <div class="chat-header">
        <button class="back-btn" onclick="closeChat()">←</button>
        <div class="chat-avatar" id="chatAvatar"></div>
        <div class="chat-info">
          <div class="chat-name" id="chatName"></div>
          <div class="chat-status">Groq AI</div>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="chat-input">
        <div class="input-area">
          <textarea id="chatInput" rows="1" placeholder="메시지..."></textarea>
        </div>
        <button class="btn-send" id="sendBtn" onclick="sendMsg()">➤</button>
      </div>
    </div>
    
    <div class="page" id="my">
      <div class="my-content">
        <div class="my-card">
          <div class="my-label">Groq API Key</div>
          <input type="password" id="apiKey" class="my-input" placeholder="gsk_...">
          <button class="my-btn" onclick="saveKey()">저장</button>
        </div>
      </div>
    </div>
  </div>
  
  <nav class="tabbar">
    <button class="tab active" onclick="goPage('home')"><div class="tab-icon">🏠</div>홈</button>
    <button class="tab" onclick="goPage('make')"><div class="tab-icon">✚</div>제작</button>
    <button class="tab" onclick="goPage('my')"><div class="tab-icon">👤</div>마이</button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<input type="file" id="imgFile" accept="image/*" onchange="uploadImg()">

<script>
const EMOJIS=['🧝','🧛','🧙','👸','🤺','🥷','👨‍🚀','🐉','🌙','⚔️','💀','🌹','🔮','🗡️','🌊','🔥','❄️','🎭','👁️','🦊'];
const GENRES=['전체','판타지','로맨스','호러','SF','현대','무협','학원','기타'];

let chars=[],filter='전체',isDark=true,selEmoji=EMOJIS[0],tmpImg=null;
let currentChar=null,chatHistory=[],isLoading=false;

function init(){
  chars=JSON.parse(localStorage.getItem('chars')||'[]');
  isDark=localStorage.getItem('theme')!=='light';
  applyTheme();
  renderHome();
  renderFilters();
}

function applyTheme(){
  if(!isDark)document.body.style.background='#f5f5fa';
  else document.body.style.background='#0a0a0e';
}

function toggleTheme(){isDark=!isDark;localStorage.setItem('theme',isDark?'dark':'light');location.reload();}

function goPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById(p).classList.add('active');
  event.target.closest('.tab').classList.add('active');
  if(p==='make')renderMake();
}

function renderFilters(){
  const f=document.getElementById('filters');
  f.innerHTML='';
  GENRES.forEach(g=>{
    const b=document.createElement('button');
    b.className='filter'+(g===filter?' active':'');
    b.textContent=g;
    b.onclick=()=>{filter=g;filterHome();}
    f.appendChild(b);
  });
}

function renderHome(){
  filterHome();
}

function filterHome(){
  const search=document.getElementById('search').value.toLowerCase();
  const g=document.getElementById('grid');
  let filtered=chars.filter(c=>{
    const ok1=filter==='전체'||c.genre===filter;
    const ok2=!search||c.name.toLowerCase().includes(search);
    return ok1&&ok2;
  });
  g.innerHTML='';
  if(!filtered.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#888">캐릭터가 없습니다</div>';return;}
  filtered.forEach((c,i)=>{
    const idx=chars.indexOf(c);
    const card=document.createElement('div');
    card.className='card';
    card.onclick=()=>startChat(idx);
    const img=c.img?`<img src="${c.img}">`:`<span>${c.emoji}</span>`;
    card.innerHTML=`<div class="card-img">${img}</div><div class="card-info"><div class="card-name">${c.name}</div><div class="card-desc">${c.desc||''}</div></div>`;
    g.appendChild(card);
  });
}

function renderMake(){
  const m=document.getElementById('makeList');
  m.innerHTML='';
  if(!chars.length){m.innerHTML='<div style="text-align:center;padding:60px 20px;color:#888">+를 눌러 캐릭터를 만드세요</div>';return;}
  chars.forEach((c,i)=>{
    const item=document.createElement('div');
    item.className='make-item';
    const av=c.img?`<img src="${c.img}">`:(c.emoji||'🧝');
    item.innerHTML=`<div class="avatar">${av}</div><div class="info"><div class="info-name">${c.name}</div><div class="info-genre">${c.genre}</div></div><div class="btns"><button class="btn-small" onclick="delChar(${i})">🗑</button></div>`;
    m.appendChild(item);
  });
}

function openMake(){
  selEmoji=EMOJIS[0];
  tmpImg=null;
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-header"><div class="modal-title">캐릭터 만들기</div><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="form-group"><label class="form-label">이미지</label><div class="img-upload" id="imgUp" onclick="document.getElementById('imgFile').click()">🖼️</div></div><div class="form-group"><label class="form-label">이모지</label><div class="emojis" id="emojis"></div></div><div class="form-group"><label class="form-label">이름</label><input type="text" class="form-input" id="fname"></div><div class="form-group"><label class="form-label">장르</label><select class="form-select" id="fgenre"><option>판타지</option><option>로맨스</option><option>호러</option><option>SF</option><option>현대</option><option>무협</option><option>학원</option><option>기타</option></select></div><div class="form-group"><label class="form-label">소개</label><input type="text" class="form-input" id="fdesc"></div><div class="form-group"><label class="form-label">성격/설정</label><textarea class="form-textarea" id="fpersona" rows="5"></textarea></div><div class="form-group"><label class="form-label">배경</label><textarea class="form-textarea" id="fworld" rows="2"></textarea></div><div class="form-group"><label class="form-label">유저이름</label><input type="text" class="form-input" id="fuser"></div><div class="form-group"><label class="form-label">첫인사</label><textarea class="form-textarea" id="fgreet" rows="2"></textarea></div><button class="form-save" onclick="saveCh()">저장</button></div>`;
  m.classList.add('active');
  document.getElementById('overlay').classList.add('active');
  renderEmojis();
}

function renderEmojis(){
  const e=document.getElementById('emojis');
  e.innerHTML='';
  EMOJIS.forEach(em=>{
    const b=document.createElement('button');
    b.className='emoji-btn'+(em===selEmoji?' sel':'');
    b.textContent=em;
    b.onclick=()=>{document.querySelectorAll('.emoji-btn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selEmoji=em;};
    e.appendChild(b);
  });
}

function uploadImg(){
  const f=document.getElementById('imgFile').files[0];if(!f)return;
  const r=new FileReader();
  r.onload=(e)=>{tmpImg=e.target.result;document.getElementById('imgUp').innerHTML=`<img src="${tmpImg}">`;document.getElementById('imgUp').classList.add('has');};
  r.readAsDataURL(f);
}

function saveCh(){
  const n=document.getElementById('fname').value.trim();
  const p=document.getElementById('fpersona').value.trim();
  if(!n||!p){toast('필수항목 입력');return;}
  const c={name:n,genre:document.getElementById('fgenre').value,desc:document.getElementById('fdesc').value.trim(),persona:p,world:document.getElementById('fworld').value.trim(),userName:document.getElementById('fuser').value.trim(),greeting:document.getElementById('fgreet').value.trim(),emoji:selEmoji,img:tmpImg};
  chars.push(c);
  localStorage.setItem('chars',JSON.stringify(chars));
  closeModal();
  renderHome();
  renderMake();
  toast('✅ 저장됨');
}

function delChar(i){
  if(confirm('삭제?')){
    chars.splice(i,1);
    localStorage.setItem('chars',JSON.stringify(chars));
    renderMake();
  }
}

function closeModal(){
  document.getElementById('modal').classList.remove('active');
  document.getElementById('overlay').classList.remove('active');
}

function startChat(idx){
  const k=localStorage.getItem('apiKey');
  if(!k){toast('⚠️ API Key 저장');return;}
  currentChar=chars[idx];
  chatHistory=[];
  goPage('chat');
  document.getElementById('chatAvatar').innerHTML=(currentChar.img?`<img src="${currentChar.img}">`:currentChar.emoji)||'🧝';
  document.getElementById('chatName').textContent=currentChar.name;
  const msgs=document.getElementById('messages');
  msgs.innerHTML='';
  if(currentChar.greeting){
    addMsg('ai',currentChar.greeting);
  }
}

function closeChat(){
  currentChar=null;
  chatHistory=[];
  goPage('home');
}

function addMsg(role,text){
  const msgs=document.getElementById('messages');
  const div=document.createElement('div');
  div.className=`msg ${role}`;
  const av=role==='ai'?(currentChar.img?`<img src="${currentChar.img}">`:currentChar.emoji||'🧝'):'👤';
  div.innerHTML=`<div class="msg-avatar">${av}</div><div class="msg-bubble">${text}</div>`;
  msgs.appendChild(div);
  setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,50);
}

function addTyping(){
  const msgs=document.getElementById('messages');
  const div=document.createElement('div');
  div.className='msg ai';
  div.id='typing';
  const av=currentChar.img?`<img src="${currentChar.img}">`:currentChar.emoji||'🧝';
  div.innerHTML=`<div class="msg-avatar">${av}</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  msgs.appendChild(div);
  setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,50);
}

function removeTyping(){
  const t=document.getElementById('typing');
  if(t)t.remove();
}

async function sendMsg(){
  const inp=document.getElementById('chatInput');
  const txt=inp.value.trim();
  if(!txt||isLoading)return;
  
  const k=localStorage.getItem('apiKey');
  if(!k){toast('API Key 필요');return;}
  
  addMsg('user',txt);
  chatHistory.push({role:'user',content:txt});
  inp.value='';
  
  isLoading=true;
  document.getElementById('sendBtn').disabled=true;
  addTyping();
  
  try{
    const prompt=`[캐릭터: ${currentChar.name}]\n[설정]\n${currentChar.persona}\n[배경]\n${currentChar.world||''}\n[상대방이름]\n${currentChar.userName||'사용자'}\n\n[대화]\n${chatHistory.map(h=>`${h.role==='user'?currentChar.userName||'사용자':currentChar.name}: ${h.content}`).join('\n')}\n\n${currentChar.userName||'사용자'}: ${txt}\n\n${currentChar.name}:`;

    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${k}`},
      body:JSON.stringify({model:'mixtral-8x7b-32768',messages:[{role:'user',content:prompt}],temperature:0.7,max_tokens:300})
    });

    if(!res.ok){removeTyping();toast('연결 오류');isLoading=false;document.getElementById('sendBtn').disabled=false;return;}
    
    const data=await res.json();
    removeTyping();
    const reply=(data.choices?.[0]?.message?.content||'').trim();
    if(reply){
      addMsg('ai',reply);
      chatHistory.push({role:'assistant',content:reply});
    }
  }catch(e){
    removeTyping();
    toast('오류');
  }
  
  isLoading=false;
  document.getElementById('sendBtn').disabled=false;
}

function saveKey(){
  const k=document.getElementById('apiKey').value.trim();
  if(!k){toast('API Key 입력');return;}
  localStorage.setItem('apiKey',k);
  toast('✅ 저장됨');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1500);
}

init();
</script>
</body>
</html>
