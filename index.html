<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이야기 세계 — AI 스토리 챗</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d12;
    --surface: #16161f;
    --surface2: #1e1e2a;
    --border: #2a2a3a;
    --accent: #c084fc;
    --accent2: #818cf8;
    --gold: #fbbf24;
    --text: #e8e8f0;
    --text-dim: #8888aa;
    --user-bubble: #1e1b4b;
    --ai-bubble: #1a1a26;
    --danger: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 배경 효과 */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(192,132,252,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(129,140,248,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* 화면들 */
  .screen { display: none; flex-direction: column; height: 100dvh; position: relative; z-index: 1; }
  .screen.active { display: flex; }

  /* ===== 홈 화면 ===== */
  #home {
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 0;
  }

  .home-header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeUp 0.6s ease both;
  }

  .home-header .logo {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 8px;
  }

  .home-header .tagline {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 300;
  }

  .api-section {
    width: 100%;
    max-width: 400px;
    animation: fadeUp 0.6s 0.1s ease both;
    margin-bottom: 24px;
  }

  .api-label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .api-input-wrap {
    display: flex;
    gap: 8px;
  }

  .api-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 13px;
    font-family: monospace;
    outline: none;
    transition: border-color 0.2s;
  }

  .api-input:focus { border-color: var(--accent); }

  .api-save-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    transition: opacity 0.2s;
  }
  .api-save-btn:hover { opacity: 0.85; }

  .api-hint {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    line-height: 1.5;
  }

  .api-hint a { color: var(--accent2); text-decoration: none; }

  /* 캐릭터 목록 */
  .chars-section {
    width: 100%;
    max-width: 400px;
    animation: fadeUp 0.6s 0.2s ease both;
    flex: 1;
    overflow-y: auto;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .section-title {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .add-char-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
  }
  .add-char-btn:hover { background: var(--surface); border-color: var(--accent); }

  .char-list { display: flex; flex-direction: column; gap: 10px; }

  .char-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
  }

  .char-card:hover {
    border-color: var(--accent);
    background: var(--surface2);
    transform: translateY(-1px);
  }

  .char-avatar {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .char-info { flex: 1; min-width: 0; }
  .char-name {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .char-genre {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 3px;
  }
  .char-desc {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .char-delete {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    border-radius: 6px;
    transition: color 0.2s;
    flex-shrink: 0;
  }
  .char-delete:hover { color: var(--danger); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
  }
  .empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* ===== 캐릭터 만들기 화면 ===== */
  #create {
    padding: 0;
  }

  .create-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 20px;
    padding: 4px;
    display: flex;
    align-items: center;
  }

  .create-title {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 18px;
    font-weight: 700;
  }

  .create-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .form-group { display: flex; flex-direction: column; gap: 8px; }

  .form-label {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .form-input, .form-textarea, .form-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .form-input:focus, .form-textarea:focus, .form-select:focus {
    border-color: var(--accent);
  }

  .form-textarea {
    resize: none;
    min-height: 100px;
    line-height: 1.6;
  }

  .form-select option { background: var(--surface2); }

  .emoji-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .emoji-btn {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--surface);
    border: 2px solid var(--border);
    font-size: 22px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .emoji-btn.selected {
    border-color: var(--accent);
    background: rgba(192,132,252,0.15);
  }

  .create-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  .create-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 12px;
    padding: 15px;
    color: white;
    font-size: 15px;
    font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .create-btn:hover { opacity: 0.9; }

  /* ===== 채팅 화면 ===== */
  #chat { background: var(--bg); }

  .chat-header {
    padding: 16px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .chat-char-avatar {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .chat-char-info { flex: 1; }
  .chat-char-name {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 16px;
    font-weight: 700;
  }
  .chat-char-genre {
    font-size: 11px;
    color: var(--accent);
  }

  .chat-menu-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 20px;
    padding: 4px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.3s ease both;
    max-width: 85%;
  }

  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.ai { align-self: flex-start; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    align-self: flex-end;
  }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .msg-bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(129,140,248,0.3);
    border-bottom-right-radius: 4px;
  }

  .msg.ai .msg-bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 14px 16px;
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }

  .typing-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: typingBounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  .chat-input-area {
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .chat-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  .chat-input:focus { border-color: var(--accent); }

  .send-btn {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; fill: white; }

  .clear-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
    flex-shrink: 0;
    align-self: center;
  }
  .clear-btn:hover { border-color: var(--danger); color: var(--danger); }

  /* 알림 토스트 */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 13px;
    color: var(--text);
    opacity: 0;
    transition: all 0.3s;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* 애니메이션 */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* 스크롤바 */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- 홈 화면 -->
<div id="home" class="screen active">
  <div class="home-header">
    <div class="logo">이야기 세계</div>
    <div class="tagline">AI 스토리 챗</div>
  </div>

  <div class="api-section">
    <div class="api-label">OpenRouter API 키</div>
    <div class="api-input-wrap">
      <input type="password" class="api-input" id="apiKeyInput" placeholder="sk-or-v1-...">
      <button class="api-save-btn" onclick="saveApiKey()">저장</button>
    </div>
    <div class="api-hint">
      무료 API 키 발급: <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a><br>
      가입 후 키를 복사해서 붙여넣으세요.
    </div>
  </div>

  <div class="chars-section">
    <div class="section-header">
      <div class="section-title">내 캐릭터</div>
      <button class="add-char-btn" onclick="showScreen('create')">+ 새 캐릭터</button>
    </div>
    <div class="char-list" id="charList"></div>
  </div>
</div>

<!-- 캐릭터 만들기 화면 -->
<div id="create" class="screen">
  <div class="create-header">
    <button class="back-btn" onclick="showScreen('home')">←</button>
    <div class="create-title">캐릭터 만들기</div>
  </div>

  <div class="create-body">
    <div class="form-group">
      <div class="form-label">아이콘</div>
      <div class="emoji-picker" id="emojiPicker"></div>
    </div>

    <div class="form-group">
      <div class="form-label">이름 *</div>
      <input type="text" class="form-input" id="charName" placeholder="예: 아라, 다크로드 제이든...">
    </div>

    <div class="form-group">
      <div class="form-label">장르</div>
      <select class="form-select" id="charGenre">
        <option value="판타지">⚔️ 판타지 / 모험</option>
        <option value="로맨스">💕 로맨스</option>
        <option value="호러">🩸 호러 / 스릴러</option>
        <option value="SF">🚀 SF / 미래</option>
        <option value="현대">🏙️ 현대 / 일상</option>
        <option value="무협">🥋 무협</option>
        <option value="기타">✨ 기타</option>
      </select>
    </div>

    <div class="form-group">
      <div class="form-label">한 줄 설명</div>
      <input type="text" class="form-input" id="charDesc" placeholder="예: 냉혹한 마왕이지만 사실 외로운...">
    </div>

    <div class="form-group">
      <div class="form-label">캐릭터 설정 (성격, 말투, 배경 등) *</div>
      <textarea class="form-textarea" id="charPersona" placeholder="예: 너의 이름은 제이든. 어둠의 마왕으로 수백 년을 살아왔지만 사실 인간의 따뜻함을 그리워한다. 말투는 냉소적이지만 상대방에게 서서히 마음을 열어간다. 반말을 사용하고 자신을 '나'라고 칭한다..."></textarea>
    </div>

    <div class="form-group">
      <div class="form-label">첫 인사말</div>
      <textarea class="form-textarea" id="charGreeting" placeholder="예: ...왜 온 거야. 이 곳에 발을 들이는 자는 보통 살아 돌아가지 못하는데." style="min-height:80px"></textarea>
    </div>
  </div>

  <div class="create-footer">
    <button class="create-btn" onclick="saveCharacter()">캐릭터 저장</button>
  </div>
</div>

<!-- 채팅 화면 -->
<div id="chat" class="screen">
  <div class="chat-header">
    <button class="back-btn" onclick="showScreen('home')" style="color:var(--text-dim);background:none;border:none;cursor:pointer;font-size:20px">←</button>
    <div class="chat-char-avatar" id="chatAvatar"></div>
    <div class="chat-char-info">
      <div class="chat-char-name" id="chatName"></div>
      <div class="chat-char-genre" id="chatGenre"></div>
    </div>
    <button class="clear-btn" onclick="clearChat()">초기화</button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="chat-input-area">
    <textarea class="chat-input" id="chatInput" placeholder="메시지를 입력하세요..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const EMOJIS = ['🧝','🧛','🧙','👸','🤺','🥷','👨‍🚀','🧜','🐉','🌙','⚔️','💀','🌹','🔮','🗡️','🌊','🔥','❄️','🎭','👁️'];
let selectedEmoji = EMOJIS[0];
let characters = [];
let currentChar = null;
let chatHistory = [];
let isLoading = false;

// 초기화
function init() {
  // 이모지 피커
  const picker = document.getElementById('emojiPicker');
  EMOJIS.forEach((e, i) => {
    const btn = document.createElement('button');
    btn.className = 'emoji-btn' + (i === 0 ? ' selected' : '');
    btn.textContent = e;
    btn.onclick = () => {
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedEmoji = e;
    };
    picker.appendChild(btn);
  });

  // API 키 로드
  const saved = localStorage.getItem('or_api_key');
  if (saved) document.getElementById('apiKeyInput').value = saved;

  // 캐릭터 로드
  characters = JSON.parse(localStorage.getItem('story_chars') || '[]');
  renderCharList();
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(name).classList.add('active');
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) { showToast('API 키를 입력하세요'); return; }
  localStorage.setItem('or_api_key', key);
  showToast('✅ API 키 저장 완료!');
}

function renderCharList() {
  const list = document.getElementById('charList');
  if (characters.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="emoji">📖</div><p>아직 캐릭터가 없어요.<br>+ 새 캐릭터를 눌러 만들어보세요!</p></div>`;
    return;
  }
  list.innerHTML = '';
  characters.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.innerHTML = `
      <div class="char-avatar">${c.emoji}</div>
      <div class="char-info">
        <div class="char-name">${c.name}</div>
        <div class="char-genre">${c.genre}</div>
        <div class="char-desc">${c.desc || c.persona.slice(0,40) + '...'}</div>
      </div>
      <button class="char-delete" onclick="deleteChar(event,${i})">🗑</button>
    `;
    card.onclick = () => startChat(i);
    list.appendChild(card);
  });
}

function saveCharacter() {
  const name = document.getElementById('charName').value.trim();
  const persona = document.getElementById('charPersona').value.trim();
  if (!name) { showToast('이름을 입력하세요'); return; }
  if (!persona) { showToast('캐릭터 설정을 입력하세요'); return; }

  const char = {
    emoji: selectedEmoji,
    name,
    genre: document.getElementById('charGenre').value,
    desc: document.getElementById('charDesc').value.trim(),
    persona,
    greeting: document.getElementById('charGreeting').value.trim()
  };

  characters.push(char);
  localStorage.setItem('story_chars', JSON.stringify(characters));

  // 폼 초기화
  document.getElementById('charName').value = '';
  document.getElementById('charDesc').value = '';
  document.getElementById('charPersona').value = '';
  document.getElementById('charGreeting').value = '';

  renderCharList();
  showScreen('home');
  showToast('✅ 캐릭터 저장 완료!');
}

function deleteChar(e, i) {
  e.stopPropagation();
  if (!confirm(`"${characters[i].name}"을(를) 삭제할까요?`)) return;
  characters.splice(i, 1);
  localStorage.setItem('story_chars', JSON.stringify(characters));
  renderCharList();
}

function startChat(i) {
  currentChar = characters[i];
  chatHistory = [];

  document.getElementById('chatAvatar').textContent = currentChar.emoji;
  document.getElementById('chatName').textContent = currentChar.name;
  document.getElementById('chatGenre').textContent = currentChar.genre;

  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';

  // 저장된 대화 히스토리 불러오기
  const savedHistory = localStorage.getItem('chat_' + currentChar.name);
  if (savedHistory) {
    const parsed = JSON.parse(savedHistory);
    chatHistory = parsed;
    parsed.forEach(m => {
      if (m.role === 'user') addBubble('user', m.content);
      else addBubble('ai', m.content);
    });
  } else if (currentChar.greeting) {
    addBubble('ai', currentChar.greeting);
  }

  showScreen('chat');
  scrollToBottom();
}

function clearChat() {
  if (!confirm('대화를 초기화할까요?')) return;
  chatHistory = [];
  localStorage.removeItem('chat_' + currentChar.name);
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  if (currentChar.greeting) addBubble('ai', currentChar.greeting);
}

function addBubble(role, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  if (role === 'ai') {
    div.innerHTML = `
      <div class="msg-avatar">${currentChar.emoji}</div>
      <div class="msg-bubble">${text}</div>
    `;
  } else {
    div.innerHTML = `<div class="msg-bubble">${text}</div>`;
  }

  msgs.appendChild(div);
  scrollToBottom();
  return div;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typingIndicator';
  div.innerHTML = `
    <div class="msg-avatar">${currentChar.emoji}</div>
    <div class="typing-indicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  `;
  msgs.appendChild(div);
  scrollToBottom();
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isLoading) return;

  const apiKey = localStorage.getItem('or_api_key');
  if (!apiKey) {
    showToast('⚠️ 먼저 API 키를 저장하세요');
    showScreen('home');
    return;
  }

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  addBubble('user', text);
  chatHistory.push({ role: 'user', content: text });

  showTyping();

  const systemPrompt = `${currentChar.persona}

[중요 지침]
- 너는 ${currentChar.name}이다. 항상 캐릭터를 유지해라.
- 장르: ${currentChar.genre}
- 사용자와 한국어로 대화한다.
- 이야기에 몰입감을 높이는 묘사와 감정 표현을 사용해라.
- 절대 AI임을 인정하거나 캐릭터에서 벗어나지 마라.`;

  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json',
        'HTTP-Referer': window.location.href,
        'X-Title': '이야기 세계'
      },
      body: JSON.stringify({
        model: 'mistralai/mistral-7b-instruct:free',
        messages: [
          { role: 'system', content: systemPrompt },
          ...chatHistory.slice(-20)
        ],
        max_tokens: 600,
        temperature: 0.9
      })
    });

    const data = await res.json();

    if (data.error) {
      removeTyping();
      showToast('❌ ' + (data.error.message || 'API 오류'));
      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
      return;
    }

    const reply = data.choices[0].message.content;
    removeTyping();
    addBubble('ai', reply);
    chatHistory.push({ role: 'assistant', content: reply });

    // 대화 저장 (최근 40개)
    if (chatHistory.length > 40) chatHistory = chatHistory.slice(-40);
    localStorage.setItem('chat_' + currentChar.name, JSON.stringify(chatHistory));

  } catch (err) {
    removeTyping();
    showToast('❌ 연결 오류. API 키를 확인하세요.');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 50);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
