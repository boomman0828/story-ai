<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이야기 세계</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090e;--s1:#111117;--s2:#17171f;--bd:#222230;--ac:#7c6af7;--tx:#e0e0ea;--dm:#5a5a7a;--red:#e17055;}
.light{--bg:#f5f5fa;--s1:#ffffff;--s2:#f0f0f7;--bd:#d8d8e8;--ac:#7c6af7;--tx:#1a1a2e;--dm:#888899;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;}
.app{display:flex;flex-direction:column;width:100%;height:100%;}
.header{height:52px;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:8px;}
.title{font-family:'Nanum Myeongjo',serif;font-size:21px;font-weight:800;flex:1;}
.theme-btn{background:none;border:none;color:var(--dm);cursor:pointer;font-size:18px;padding:8px;}
.pages{flex:1;overflow:hidden;display:flex;}
.page{display:none;width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;flex-direction:column;}
.page.active{display:flex;}
.tabbar{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--s1);border-top:1px solid var(--bd);display:flex;z-index:100;}
.tab-btn{flex:1;background:none;border:none;color:var(--dm);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'Noto Sans KR',sans-serif;font-size:12px;}
.tab-btn.active{color:var(--ac);}
.search-box{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:12px 14px;}
.search-box input{flex:1;background:none;border:none;color:var(--tx);font-size:13px;outline:none;}
.filter-scroll{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none;}
.filter-chip{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:11px;background:var(--s2);border:1px solid var(--bd);color:var(--dm);cursor:pointer;}
.filter-chip.active{background:rgba(124,106,247,0.15);border-color:var(--ac);color:var(--ac);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 80px;}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;}
.card-img{width:100%;aspect-ratio:3/4;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:48px;}
.card-img img{width:100%;height:100%;object-fit:cover;}
.card-info{padding:10px 11px;}
.card-name{font-family:'Nanum Myeongjo',serif;font-size:15px;font-weight:700;margin-bottom:3px;}
.card-desc{font-size:11px;color:var(--dm);}
.empty{text-align:center;padding:60px 20px;color:var(--dm);}
.make-header{padding:16px;background:var(--s1);border-bottom:1px solid var(--bd);}
.make-list{padding:14px 12px 90px;flex:1;overflow-y:auto;}
.make-card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;display:flex;gap:11px;padding:13px;margin-bottom:8px;align-items:center;}
.make-avatar{width:46px;height:46px;border-radius:11px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.make-avatar img{width:100%;height:100%;object-fit:cover;}
.make-info{flex:1;}
.make-btns{display:flex;gap:4px;}
.make-btn{background:none;border:none;color:var(--dm);cursor:pointer;font-size:15px;padding:6px;}
.fab{position:fixed;bottom:74px;right:16px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--ac),#a29bfe);border:none;color:white;font-size:26px;cursor:pointer;z-index:50;}
.my-content{padding:14px;flex:1;overflow-y:auto;}
.my-card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;}
.my-title{font-size:10px;color:var(--dm);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;font-weight:600;}
.my-input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;color:var(--tx);font-size:12px;outline:none;margin-bottom:8px;font-family:monospace;}
.my-btn{width:100%;background:var(--ac);color:white;border:none;border-radius:9px;padding:10px;cursor:pointer;font-weight:500;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:200;display:none;}
.overlay.active{display:block;}
.modal{position:fixed;bottom:0;left:0;right:0;width:100%;max-height:95dvh;background:var(--s1);border-radius:22px 22px 0 0;display:none;flex-direction:column;animation:slideUp .27s ease;z-index:201;}
.modal.active{display:flex;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:30px;height:4px;background:var(--bd);border-radius:2px;margin:9px auto 0;}
.modal-header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);}
.modal-title{font-family:'Nanum Myeongjo',serif;font-size:17px;font-weight:700;flex:1;}
.modal-close{background:none;border:none;color:var(--dm);font-size:20px;cursor:pointer;}
.modal-body{flex:1;overflow-y:auto;padding:14px;}
.modal-footer{padding:12px 14px;border-top:1px solid var(--bd);}
.form-group{margin-bottom:14px;}
.form-label{font-size:10px;color:var(--dm);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:block;font-weight:600;}
.form-input,.form-textarea,.form-select{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;color:var(--tx);font-size:13px;outline:none;}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--ac);}
.form-textarea{resize:none;line-height:1.6;}
.img-upload{border:2px dashed var(--bd);border-radius:11px;padding:18px;text-align:center;cursor:pointer;}
.img-upload.has img{width:100%;height:150px;object-fit:cover;border-radius:9px;}
.emoji-grid{display:flex;flex-wrap:wrap;gap:5px;}
.emoji-btn{width:38px;height:38px;border-radius:8px;background:var(--s2);border:2px solid var(--bd);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.emoji-btn.selected{border-color:var(--ac);background:rgba(124,106,247,0.12);}
.tag-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.tag-item{display:flex;align-items:center;gap:2px;background:rgba(124,106,247,0.1);border:1px solid rgba(124,106,247,0.22);border-radius:20px;padding:3px 8px;font-size:11px;color:var(--ac);}
.form-save{width:100%;background:linear-gradient(135deg,var(--ac),#a29bfe);border:none;border-radius:11px;padding:13px;color:white;font-size:14px;font-weight:500;cursor:pointer;}
.toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:9px 16px;font-size:11px;color:var(--tx);opacity:0;transition:opacity .22s;z-index:400;}
.toast.show{opacity:1;}
.chat-header{height:52px;background:var(--s1);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:8px;}
.chat-avatar{width:36px;height:36px;border-radius:8px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;}
.chat-avatar img{width:100%;height:100%;object-fit:cover;}
.chat-info{flex:1;}
.chat-name{font-family:'Nanum Myeongjo',serif;font-size:14px;font-weight:700;}
.chat-status{font-size:10px;color:var(--ac);margin-top:1px;}
.chat-close{background:none;border:none;color:var(--dm);font-size:18px;cursor:pointer;}
.messages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px;display:flex;flex-direction:column;gap:10px;}
.msg{display:flex;gap:8px;max-width:85%;animation:msgIn .22s ease;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg.ai{align-self:flex-start;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:28px;height:28px;border-radius:7px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden;}
.msg-avatar img{width:100%;height:100%;object-fit:cover;}
.msg-bubble{padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.msg.user .msg-bubble{background:rgba(124,106,247,0.2);border-radius:14px 3px 14px 14px;}
.msg.ai .msg-bubble{background:var(--s2);border-radius:3px 14px 14px 14px;}
.typing{display:flex;align-items:flex-end;gap:3px;padding:10px 13px;background:var(--s2);border-radius:14px;width:fit-content;}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--dm);animation:typing .6s infinite;}
.typing-dot:nth-child(2){animation-delay:.1s}
.typing-dot:nth-child(3){animation-delay:.2s}
@keyframes typing{0%,60%{opacity:.3}30%{opacity:1}}
.chat-input{display:flex;gap:6px;padding:12px;background:var(--s1);border-top:1px solid var(--bd);}
.chat-textarea{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;color:var(--tx);font-size:13px;resize:none;max-height:100px;outline:none;}
.chat-textarea:focus{border-color:var(--ac);}
.chat-send{background:linear-gradient(135deg,var(--ac),#a29bfe);border:none;width:36px;height:36px;border-radius:9px;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.chat-send:disabled{opacity:.3;cursor:not-allowed;}
input[type="file"]{display:none;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">이야기 세계</div>
    <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
  <div class="pages">
    <div class="page active" id="home">
      <div class="search-box"><span>🔍</span><input id="search" placeholder="검색..." oninput="updateHome()"></div>
      <div class="filter-scroll" id="filters"></div>
      <div class="grid" id="chars"></div>
    </div>
    <div class="page" id="make">
      <div class="make-header"><div class="title">캐릭터 제작</div></div>
      <div class="make-list" id="makeList"></div>
      <button class="fab" onclick="openMakeModal()">+</button>
    </div>
    <div class="page" id="chat">
      <div class="chat-header">
        <button class="chat-close" onclick="closeChat()">←</button>
        <div class="chat-avatar" id="chatAvatar"></div>
        <div class="chat-info"><div class="chat-name" id="chatName"></div><div class="chat-status">Groq AI</div></div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="chat-input">
        <textarea class="chat-textarea" id="chatInput" placeholder="메시지..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
        <button class="chat-send" id="sendBtn" onclick="sendMsg()">➤</button>
      </div>
    </div>
    <div class="page" id="my">
      <div class="my-content" id="myPage"></div>
    </div>
  </div>
  <nav class="tabbar">
    <button class="tab-btn active" onclick="switchPage('home')"><div style="font-size:20px">🏠</div>홈</button>
    <button class="tab-btn" onclick="switchPage('make')"><div style="font-size:20px">✚</div>제작</button>
    <button class="tab-btn" onclick="switchPage('my')"><div style="font-size:20px">👤</div>마이</button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<input type="file" id="charFile" accept="image/*" onchange="uploadImg()">

<script>
const EMOJIS=['🧝','🧛','🧙','👸','🤺','🥷','👨‍🚀','🐉','🌙','⚔️','💀','🌹','🔮','🗡️','🌊','🔥','❄️','🎭','👁️','🦊','🐺'];
const GENRES=['전체','판타지','로맨스','호러','SF','현대','무협','학원','기타'];

let chars=[],filter='전체',isDark=true,selEmoji=EMOJIS[0],tmpImg=null,tmpTags=[];
let currentChar=null,chatHistory=[],isLoading=false;

function init(){
  chars=JSON.parse(localStorage.getItem('chars')||'[]');
  isDark=localStorage.getItem('theme')!=='light';
  applyTheme();
  updateHome();
  renderFilters();
  renderMy();
}

function applyTheme(){
  document.body.className=isDark?'':'light';
  document.querySelector('.theme-btn').textContent=isDark?'☀️':'🌙';
}

function toggleTheme(){isDark=!isDark;localStorage.setItem('theme',isDark?'dark':'light');applyTheme();}

function switchPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById(p).classList.add('active');
  event.target.closest('.tab-btn').classList.add('active');
  if(p==='make')renderMake();
}

function renderFilters(){
  const f=document.getElementById('filters');
  f.innerHTML='';
  GENRES.forEach(g=>{
    const b=document.createElement('button');
    b.className='filter-chip'+(g===filter?' active':'');
    b.textContent=g;
    b.onclick=()=>{filter=g;updateHome();}
    f.appendChild(b);
  });
}

function updateHome(){
  const search=document.getElementById('search').value.toLowerCase();
  const g=document.getElementById('chars');
  let filtered=chars.filter(c=>{
    const ok1=filter==='전체'||c.genre===filter;
    const ok2=!search||c.name.toLowerCase().includes(search);
    return ok1&&ok2;
  });
  if(!filtered.length){g.innerHTML=`<div class="empty" style="grid-column:1/-1"><div style="font-size:48px;margin-bottom:12px">📖</div></div>`;return;}
  g.innerHTML='';
  filtered.forEach(c=>{
    const idx=chars.indexOf(c);
    const card=document.createElement('div');
    card.className='card';
    card.onclick=()=>openChat(idx);
    const img=c.img?`<img src="${c.img}">`:`<span>${c.emoji}</span>`;
    card.innerHTML=`<div class="card-img">${img}</div><div class="card-info"><div class="card-name">${c.name}</div><div class="card-desc">${c.desc||''}</div></div>`;
    g.appendChild(card);
  });
}

function renderMake(){
  const m=document.getElementById('makeList');
  if(!chars.length){m.innerHTML=`<div class="empty"><div style="font-size:48px">✨</div></div>`;return;}
  m.innerHTML='';
  chars.forEach((c,i)=>{
    const item=document.createElement('div');
    item.className='make-card';
    const av=c.img?`<img src="${c.img}">`:(c.emoji||'🧝');
    item.innerHTML=`<div class="make-avatar">${av}</div><div class="make-info"><div style="font-size:14px;font-weight:500">${c.name}</div><div style="font-size:11px;color:var(--dm);margin-top:2px">${c.genre}</div></div><div class="make-btns"><button class="make-btn" onclick="delChar(${i})">🗑</button></div>`;
    m.appendChild(item);
  });
}

function renderMy(){
  const m=document.getElementById('myPage');
  m.innerHTML=`<div class="my-card"><div class="my-title">Groq API Key</div><input type="password" id="apiKey" class="my-input" placeholder="gsk_..."><button class="my-btn" onclick="saveKey()">저장</button></div>`;
  document.getElementById('apiKey').value=localStorage.getItem('apiKey')||'';
}

function saveKey(){
  const k=document.getElementById('apiKey').value.trim();
  if(!k){toast('API Key 입력');return;}
  localStorage.setItem('apiKey',k);
  toast('✅ 저장됨');
}

function openMakeModal(){
  selEmoji=EMOJIS[0];
  tmpImg=null;
  tmpTags=[];
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-handle"></div><div class="modal-header"><div class="modal-title">캐릭터 만들기</div><button class="modal-close" onclick="closeModal()">✕</button></div><div class="modal-body"><div class="form-group"><label class="form-label">이미지</label><div class="img-upload" id="imgUp" onclick="document.getElementById('charFile').click()"><div style="font-size:26px;margin-bottom:4px">🖼️</div></div></div><div class="form-group"><label class="form-label">이모지</label><div class="emoji-grid" id="emojiGr"></div></div><div class="form-group"><label class="form-label">이름</label><input type="text" class="form-input" id="name"></div><div class="form-group"><label class="form-label">장르</label><select class="form-select" id="genre"><option>판타지</option><option>로맨스</option><option>호러</option><option>SF</option><option>현대</option><option>무협</option><option>학원</option><option>기타</option></select></div><div class="form-group"><label class="form-label">소개</label><input type="text" class="form-input" id="desc"></div><div class="form-group"><label class="form-label">성격/설정</label><textarea class="form-textarea" id="persona" rows="6"></textarea></div><div class="form-group"><label class="form-label">배경</label><textarea class="form-textarea" id="world" rows="3"></textarea></div><div class="form-group"><label class="form-label">유저이름</label><input type="text" class="form-input" id="user"></div><div class="form-group"><label class="form-label">첫인사</label><textarea class="form-textarea" id="greet" rows="2"></textarea></div></div><div class="modal-footer"><button class="form-save" onclick="saveCh()">저장</button></div>`;
  m.classList.add('active');
  document.getElementById('overlay').classList.add('active');
  renderEmoji();
}

function renderEmoji(){
  const g=document.getElementById('emojiGr');
  g.innerHTML='';
  EMOJIS.forEach(e=>{
    const b=document.createElement('button');
    b.className='emoji-btn'+(e===selEmoji?' selected':'');
    b.textContent=e;
    b.onclick=()=>{document.querySelectorAll('.emoji-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selEmoji=e;};
    g.appendChild(b);
  });
}

function uploadImg(){
  const f=document.getElementById('charFile').files[0];if(!f)return;
  const r=new FileReader();
  r.onload=(e)=>{tmpImg=e.target.result;document.getElementById('imgUp').classList.add('has');document.getElementById('imgUp').innerHTML=`<img src="${tmpImg}">`;};
  r.readAsDataURL(f);
}

function saveCh(){
  const n=document.getElementById('name').value.trim();
  const p=document.getElementById('persona').value.trim();
  if(!n||!p){toast('필수항목');return;}
  const c={name:n,genre:document.getElementById('genre').value,desc:document.getElementById('desc').value.trim(),persona:p,world:document.getElementById('world').value.trim(),userName:document.getElementById('user').value.trim(),greeting:document.getElementById('greet').value.trim(),emoji:selEmoji,img:tmpImg};
  chars.push(c);
  localStorage.setItem('chars',JSON.stringify(chars));
  closeModal();
  updateHome();
  renderMake();
  toast('✅ 저장');
}

function delChar(i){
  if(!confirm('삭제?'))return;
  chars.splice(i,1);
  localStorage.setItem('chars',JSON.stringify(chars));
  renderMake();
}

function closeModal(){
  document.getElementById('modal').classList.remove('active');
  document.getElementById('overlay').classList.remove('active');
}

function openChat(idx){
  const k=localStorage.getItem('apiKey');
  if(!k){toast('⚠️ API Key 저장');return;}
  currentChar=chars[idx];
  chatHistory=[];
  switchPage('chat');
  document.getElementById('chatAvatar').innerHTML=(currentChar.img?`<img src="${currentChar.img}">`:currentChar.emoji)||'🧝';
  document.getElementById('chatName').textContent=currentChar.name;
  const msgs=document.getElementById('messages');
  msgs.innerHTML='';
  if(currentChar.greeting)addMsg('ai',currentChar.greeting);
  setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,100);
}

function closeChat(){currentChar=null;chatHistory=[];switchPage('home');}

function addMsg(role,text){
  const msgs=document.getElementById('messages');
  const div=document.createElement('div');
  div.className=`msg ${role}`;
  div.innerHTML=`<div class="msg-avatar">${role==='ai'?(currentChar.img?`<img src="${currentChar.img}">`:currentChar.emoji||'🧝'):'👤'}</div><div class="msg-bubble">${text}</div>`;
  msgs.appendChild(div);
  setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,50);
}

function addTyping(){
  const msgs=document.getElementById('messages');
  const div=document.createElement('div');
  div.className='msg ai';
  div.id='typing';
  div.innerHTML=`<div class="msg-avatar">${currentChar.img?`<img src="${currentChar.img}">`:currentChar.emoji||'🧝'}</div><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  msgs.appendChild(div);
  setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,50);
}

function removeTyping(){
  const t=document.getElementById('typing');
  if(t)t.remove();
}

async function sendMsg(){
  const inp=document.getElementById('chatInput');
  const txt=inp.value.trim();
  if(!txt||isLoading)return;
  
  const k=localStorage.getItem('apiKey');
  if(!k){toast('API Key 없음');return;}
  
  addMsg('user',txt);
  chatHistory.push({role:'user',content:txt});
  inp.value='';
  
  isLoading=true;
  document.getElementById('sendBtn').disabled=true;
  addTyping();
  
  try{
    const prompt=`[캐릭터: ${currentChar.name}]\n[설정]\n${currentChar.persona}\n[배경]\n${currentChar.world||''}\n[상대방이름]\n${currentChar.userName||'사용자'}\n\n[대화기록]\n${chatHistory.map(h=>`${h.role==='user'?currentChar.userName||'사용자':currentChar.name}: ${h.content}`).join('\n')}\n\n${currentChar.userName||'사용자'}: ${txt}\n\n${currentChar.name}:`;

    const response=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${k}`},
      body:JSON.stringify({model:'mixtral-8x7b-32768',messages:[{role:'user',content:prompt}],temperature:0.7,max_tokens:500})
    });

    if(!response.ok){removeTyping();toast('❌ 연결오류');isLoading=false;document.getElementById('sendBtn').disabled=false;return;}
    
    const data=await response.json();
    removeTyping();
    const reply=(data.choices?.[0]?.message?.content||'').trim();
    if(reply){
      addMsg('ai',reply);
      chatHistory.push({role:'assistant',content:reply});
    }
  }catch(e){
    removeTyping();
    toast('❌ '+e.message.substring(0,15));
  }
  
  isLoading=false;
  document.getElementById('sendBtn').disabled=false;
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

document.getElementById('overlay').addEventListener('click',closeModal);

init();
</script>
</body>
</html>
